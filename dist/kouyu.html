      } else setBusy(false, c.voiceRec ? '说完了。确认没问题就发送（录音会一起存下）' : '');
    }).then(v => { c.voice = v; });
  }

  /* ---------------- 实战对话 ---------------- */
  const personaOf = id => S.personas.find(p => p.id === id) || null;
  const learnerCount = c => (c ? c.msgs.filter((m, i) => i > 0 && m.role === 'user').length : 0);
  function saveConvo() { if (cur) ls.set('convo:' + cur.id, cur.convo); }
  function trimMsgs(msgs) {
    const out = msgs.map(m => ({ role: m.role, content: m.content }));
    const enc = new TextEncoder();
    const size = () => out.reduce((a, m) => a + enc.encode(m.content).length, 0);
    while (out.length > 3 && size() > 48000) out.splice(1, 1);
    return out;
  }

  function renderConvo() {
    if (!cur || !cur.els.convo) return;
    const pane = clear(cur.els.convo), c = cur.convo;
    if (!Platform.llm.available) { put(pane, llmNotice()); return; }
    if (!c) {
      if (!S.personas.length) { put(pane, h('p', { class: 'muted' }, S.loaded.personas ? '还没有角色。' : '正在读取角色……')); return; }
      put(pane, h('p', { class: 'small muted' }, '选一个人聊 8 到 10 轮。过程中不纠错，结束后统一讲评。'),
        h('div', { class: 'persona-grid' }, S.personas.map(p => h('button', { class: 'persona', type: 'button', onclick: () => startConvo(p) },
          h('span', { class: 'pn' }, p.name, h('span', { class: 'chip ' + (p.native ? 'accent' : '') }, p.native ? '母语' : p.fluent ? '非母语 · 流利' : '非母语')),
          h('span', { class: 'pb' }, p.bio_zh || p.bio),
          h('span', { class: 'ps' }, '场景：' + (p.setting_zh || p.setting))))));
      return;
    }
    const p = personaOf(c.personaId) || { name: c.personaName || '对方', setting_zh: '' };
    const n = learnerCount(c);
    put(pane, h('div', { class: 'row-between' },
      h('div', null, h('b', null, '和 ' + p.name + ' 聊天'), h('p', { class: 'small muted' }, p.setting_zh || '')),
      h('button', { class: 'btn quiet small', type: 'button', onclick: resetConvo }, c.debrief ? '换个人再聊' : '换人')));
    const thread = h('div', { class: 'thread' });
    c.msgs.forEach((m, i) => { if (i === 0) return; put(thread, m.role === 'assistant' ? bubbleThem(m.content, p.name) : bubbleMe(m.content)); });
    cur.els.convoLive = h('p', { class: 'en' });
    const liveBubble = h('div', { class: 'bubble them', hidden: true }, h('span', { class: 'who' }, p.name), cur.els.convoLive);
    cur.els.convoLiveBubble = liveBubble;
    put(thread, liveBubble);
    put(pane, thread);

    if (c.debrief) { put(pane, debriefView(c)); return; }

    const lastIsUser = c.msgs[c.msgs.length - 1].role === 'user';
    cur.els.cta = h('textarea', { id: 'convo-answer', class: 'en', rows: 3, placeholder: '用输入法的语音输入回答；卡住的词直接说中文；别手动改', oninput: () => ls.set('cdraft:' + cur.id, cur.els.cta.value) });
    cur.els.cta.value = ls.get('cdraft:' + cur.id, '') || '';
    cur.els.cstatus = h('div', { class: 'status', role: 'status' }, n >= 8 ? '聊得差不多了，可以结束看讲评。' : '第 ' + n + ' 轮（8 到 10 轮后讲评）');
    cur.els.cstop = h('button', { class: 'btn ghost small', type: 'button', hidden: true, onclick: () => cur.ctl && cur.ctl.abort() }, '停止');
    cur.els.csend = h('button', { class: 'btn', type: 'button', onclick: convoSend }, '发送');
    cur.els.cproblem = h('div', { class: 'stack-s' });
    put(pane, h('div', { class: 'composer' },
      cur.els.cta,
      h('div', { class: 'composer-row' }, cur.els.cstatus, cur.els.cstop, cur.els.csend),
      cur.els.cproblem,
      h('div', { class: 'row' },
        lastIsUser ? h('button', { class: 'btn ghost small', type: 'button', onclick: () => personaReply() }, '让对方重新回复') : null,
        n > 0 ? h('button', { class: 'btn ghost small', type: 'button', onclick: runDebrief }, '结束对话，看讲评') : null)));
  }

  function convoBusy(b, msg) {
    cur.busy = b;
    const e = cur.els;
    if (e.csend) e.csend.disabled = b;
    if (e.cstop) e.cstop.hidden = !b;
    if (e.cstatus) put(clear(e.cstatus), b ? h('span', { class: 'spin', 'aria-hidden': 'true' }) : null, msg || '');
  }
  function convoProblem(err) {
    const box = cur && cur.els.cproblem;
    if (!box) return;
    clear(box);
    if (err && err.code !== 'cancelled') {
      put(box, h('div', { class: err.code === 'rate_limited' ? 'notice' : 'notice bad' }, sampleErrZh(err.code)));
      if (err.text) put(box, h('details', null, h('summary', { class: 'small muted' }, '查看 Claude 的原文'), h('pre', { class: 'raw-reply' }, err.text)));
    }
  }

  async function startConvo(p) {
    if (!cur || cur.busy) return;
    const instr = fill(PROMPTS.convo, { name: p.name, bio: p.bio, setting: p.setting, style: p.native ? '' : NON_NATIVE_STYLE });
    cur.convo = { personaId: p.id, personaName: p.name, msgs: [{ role: 'user', content: instr, at: nowIso() }], debrief: null, saved: false, startedAt: nowIso() };
    saveConvo();
    renderConvo();
    await personaReply();
  }

  function resetConvo() {
    if (!cur || cur.busy) return;
    cur.convo = null; saveConvo(); ls.del('cdraft:' + cur.id);
    renderConvo();
  }

  async function personaReply() {
    const c = cur;
    if (!c || !c.convo || c.busy) return;
    const cv = c.convo;
    const ctl = new AbortController();
    c.ctl = ctl;
    convoBusy(true, 'Thinking…');
    convoProblem(null);
    if (c.els.convoLiveBubble) { c.els.convoLiveBubble.hidden = false; c.els.convoLive.textContent = '…'; }
    try {
      const r = await Platform.llm.text(trimMsgs(cv.msgs), { tier: 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => { if (c.els.convoLive) c.els.convoLive.textContent = text; } });
      cv.msgs.push({ role: 'assistant', content: r.text.trim(), at: nowIso() });
      saveConvo();
    } catch (e) {
      if (cur === c) { c.busy = false; renderConvo(); convoProblem(e); }
      return;
    } finally { c.ctl = null; c.busy = false; }
    if (cur !== c) return;
    renderConvo();
    if (cur.els.cta) cur.els.cta.focus({ preventScroll: true });
    if (learnerCount(cv) >= 10) await runDebrief();
  }

  async function convoSend() {
    const c = cur;
    if (!c || !c.convo || c.busy) return;
    const text = c.els.cta.value.trim();
    if (!text) { c.els.cta.focus(); return; }
    c.convo.msgs.push({ role: 'user', content: text, at: nowIso() });
    saveConvo(); ls.del('cdraft:' + c.id);
    renderConvo();
    Sessions.ensure().catch(() => {});
    await personaReply();
  }

  async function runDebrief() {
    const c = cur;
    if (!c || !c.convo || c.busy) return;
    const cv = c.convo;
    const p = personaOf(cv.personaId) || { id: cv.personaId, name: cv.personaName || 'P' };
    const lines = [], learner = [];
    cv.msgs.forEach((m, i) => {
      if (i === 0) return;
      if (m.role === 'assistant') lines.push('P: ' + m.content);
      else { learner.push(i); lines.push('L' + learner.length + ': ' + m.content); }
    });
    if (!learner.length) return;
    const ctl = new AbortController();
    c.ctl = ctl;
    convoBusy(true, '讲评中…… Thinking…');
    convoProblem(null);
    try {
      const r = await Platform.llm.json(fill(PROMPTS.debrief, { name: p.name, rules: RULES_1_TO_3, transcript_lines: lines.join('\n') }), { tier: 'default', cache: false, signal: ctl.signal });
      if (!r || typeof r !== 'object' || !Array.isArray(r.turns)) throw { code: 'bad_shape', text: JSON.stringify(r) };
      const perTurn = learner.map((mi, k) => {
        const t = r.turns.find(x => x && Number(x.i) === k + 1) || r.turns[k] || {};
        let natural = t.natural == null ? null : (str(t.natural) || null);
        const corrected = str(t.corrected) || cv.msgs[mi].content;
        if (natural && normText(natural) === normText(corrected)) natural = null;
        return { corrected, errors: cleanErrors(t.errors), natural };
      });
      const s = r.summary && typeof r.summary === 'object' ? r.summary : {};
      const summary = {
        top: arr(s.top).map(x => x && ({ type: ERROR_MAP[str(x.type).toUpperCase()] ? str(x.type).toUpperCase() : 'STRUCT', count: Number(x.count) || 0, example_orig: str(x.example_orig), example_fix: str(x.example_fix) })).filter(Boolean).slice(0, 3),
        strengths_zh: str(s.strengths_zh), rule_zh: str(s.rule_zh),
        next_focus_zh: Array.isArray(s.next_focus_zh) ? s.next_focus_zh.map(str).filter(Boolean) : str(s.next_focus_zh) ? [str(s.next_focus_zh)] : [],
      };
      cv.debrief = { perTurn, summary, at: nowIso() };
      saveConvo();
      const sid = await Sessions.ensure();
      for (let k = 0; k < learner.length; k++) {
        const mi = learner[k], m = cv.msgs[mi];
        const prev = cv.msgs[mi - 1] && cv.msgs[mi - 1].role === 'assistant' ? cv.msgs[mi - 1].content : '';
        const next = cv.msgs[mi + 1] && cv.msgs[mi + 1].role === 'assistant' ? cv.msgs[mi + 1].content : null;
        const pt = perTurn[k];
        await Platform.store.set('turns/' + uid('t'), {
          nodeId: c.id, sessionId: sid, mode: 'convo', q: prev, raw: m.content,
          corrected: pt.corrected, natural: pt.natural, errors: pt.errors,
          asked_back: /\?\s*$/.test(m.content) || /\?\s*$/.test(pt.corrected),
          n_words: countWords(m.content), vocab: [], followup: next, persona: p.id, createdAt: m.at || nowIso(),
        });
      }
      cv.saved = true;
      saveConvo();
      if (!c.node.status || c.node.status === 'todo') Platform.store.update('nodes/' + c.id, { status: 'doing' }).catch(() => {});
    } catch (e) {
      if (cur === c) { c.busy = false; renderConvo(); convoProblem(e.code ? e : { code: 'upstream_error' }); }
      return;
    } finally { c.ctl = null; c.busy = false; }
    if (cur === c) renderConvo();
  }

  function debriefView(c) {
    const d = c.debrief, box = h('div', { class: 'card stack' }, h('h3', { class: 'section-title' }, '讲评'));
    let k = 0;
    c.msgs.forEach((m, i) => {
      if (i === 0 || m.role !== 'user') return;
      const pt = d.perTurn[k++] || { corrected: m.content, errors: [], natural: null };
      put(box, h('div', { class: 'debrief-turn' },
        bubbleMe(m.content),
        h('div', { class: 'fb' }, fbRow('改后', pt.corrected, 'corrected'), errorsBlock(pt.errors), pt.natural ? fbRow('更自然', pt.natural) : null)));
    });
    const s = d.summary || {};
    put(box, h('div', { class: 'stack-s' },
      h('p', { class: 'label' }, '总结'),
      arr(s.top).length ? h('ul', { class: 'stack-s' }, s.top.map(t => h('li', null, h('b', null, (ERROR_MAP[t.type] ? ERROR_MAP[t.type].name : t.type) + ' ×' + t.count), ' ', h('span', { class: 'en-s' }, t.example_orig ? h('s', null, t.example_orig) : null, t.example_orig ? ' → ' : '', t.example_fix)))) : null,
      s.strengths_zh ? h('p', null, '做得好：' + s.strengths_zh) : null,
      s.rule_zh ? h('p', { class: 'notice info' }, h('b', null, '口诀：'), s.rule_zh) : null,
      arr(s.next_focus_zh).length ? h('p', null, '下次重点：' + s.next_focus_zh.join('；')) : null,
      h('p', { class: 'small muted' }, c.saved ? '这次对话的每条回答都已记进错误统计。' : '')));
    return box;
  }

  /* ---------------- 底部：盖章、结束本次练习 ---------------- */
  function renderFoot(result) {
    if (!cur) return;
    if (result !== undefined) cur.footResult = result;
    const node = cur.node, foot = clear(cur.els.foot);
    if (cur.footResult) put(foot, cur.footResult);
    if (node.track === 'listening') {
      put(foot, h('div', { class: 'node-foot' },
        node.status === 'done' ? h('span', { class: 'small muted' }, '已经听熟了。') :
          h('button', { class: 'btn ghost', type: 'button', onclick: () => Platform.store.update('nodes/' + node.id, { status: 'done' }).then(() => toast('已盖章'), e => toast('没存上：' + e.code)) }, '听熟了，盖章')));
      return;
    }
    put(foot, h('div', { class: 'node-foot' },
      h('button', { class: 'btn ghost', type: 'button', onclick: () => finishNode(false) }, node.status === 'done' ? '重新整理口袋本' : '这个节点练完了'),
      Sessions.currentId ? h('button', { class: 'btn ghost', type: 'button', onclick: () => App.endSession() }, '结束本次练习') : null));
  }

  async function finishNode(force) {
    const c = cur;
    if (!c || c.busy) return;
    const node = c.node;
    const answers = Data.turnsOfNode(node.id).map(t => t.corrected).filter(Boolean).slice(-12);
    const stampOnly = () => Platform.store.update('nodes/' + node.id, { status: 'done' }).then(() => { toast('已盖章'); renderFoot(null); }, e => toast('没存上：' + e.code));
    if (!answers.length) { toast('先练几句，再整理口袋本'); return; }
    if (!Platform.llm.available) { await stampOnly(); return; }
    const existing = S.bank[node.id];
    if (existing && existing.edited && !force) {
      renderFoot(h('div', { class: 'notice' }, '口袋本里这一条你改过。重新生成会覆盖你的修改。',
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', { class: 'btn small', type: 'button', onclick: () => finishNode(true) }, '覆盖'),
          h('button', { class: 'btn ghost small', type: 'button', onclick: stampOnly }, '只盖章，不覆盖'))));
      return;
    }
    c.busy = true;
    renderFoot(h('p', { class: 'status' }, h('span', { class: 'spin', 'aria-hidden': 'true' }), ' 正在整理最佳回答…… Thinking…'));
    try {
      const facts = Data.profileFacts();
      const r = await Platform.llm.json(fill(PROMPTS.bank, {
        title_zh: node.title_zh, main_q: node.main_q || '', profile_facts: facts.length ? facts.join('; ') : '(none)',
        corrected_answers: '\n' + answers.map(a => '- ' + a).join('\n'),
      }), { tier: 'default', cache: false });
      const best_en = str(r && r.best_en);
      if (!best_en) throw { code: 'bad_shape', text: JSON.stringify(r) };
      const chunks = arr(r.chunks).map(x => x && ({ en: str(x.en), zh: str(x.zh) })).filter(x => x && x.en).slice(0, 8);
      await Platform.store.set('bank/' + node.id, { best_en, chunks, updatedAt: nowIso(), edited: false });
      await Platform.store.update('nodes/' + node.id, { status: 'done' });
      if (cur !== c) return;
      renderFoot(h('div', { class: 'card stack' },
        h('p', { class: 'label' }, '已盖章 · 存进口袋本'),
        h('div', { class: 'q-line row' }, h('p', { class: 'en', style: 'flex:1' }, best_en), sayBtn(best_en)),
        h('div', { class: 'chunks' }, chunks.map(x => h('div', { class: 'chunk' }, h('span', { class: 'en-s' }, x.en), h('span', { class: 'zh' }, x.zh), sayBtn(x.en)))),
        h('button', { class: 'link-btn', type: 'button', onclick: () => App.go('pocket') }, '去口袋本看看')));
    } catch (e) {
      if (cur === c) renderFoot(h('div', { class: 'notice bad' }, sampleErrZh(e.code || 'upstream_error'), ' ', h('button', { class: 'link-btn', type: 'button', onclick: () => finishNode(force) }, '重试')));
    } finally { c.busy = false; }
  }

  Bus.on('session', () => { if (cur) renderFoot(); });

  return {
    init, show, openNode,
    get currentNodeId() { return cur ? cur.id : ls.get('lastNode'); },
  };
})();

/* ---- record.js ---- */
/* =====================================================================
 * 录音：页面里录（MediaRecorder）或用系统录音机 / 选文件（备选 A），
 * 本地粗测停顿，上传到 assets，写 recordings（status=pending）。
 * 分析由 Claude 会话按 tools/RUNBOOK.md 完成后写回。
 * ===================================================================== */

const Record = (() => {
  let root = null, built = false, visible = false;
  const els = {};
  let live = null;        // 正在录音
  let pending = null;     // 最近一段（本地结果 + 上传状态）
  const expanded = new Set();
  const bodyCache = new Map();
  const blobUrls = {};

  const UPLOAD_ERR_ZH = {
    too_large: '文件太大了（上限：原始文件 15 MB，或 20 MB 的 webm/mp4）。录短一点再传。',
    quota_or_state: '存储空间满了。到下面的列表里删掉分析完的音频再试。',
    rate_limited: '传得太频繁了，稍等一下再点重新上传。',
    unsupported_type: '这个格式传不上去。',
    not_granted: '只有这个 artifact 的所有者和编辑者能上传录音。',
    capability_disabled: '当前环境里不能上传。',
    unavailable: '当前环境里不能上传（需要在 Claude 的 artifact 查看器里打开）。',
    upstream_auth: '登录状态失效了，刷新页面或重新登录后再试。',
    store_unavailable: '存储服务暂时不可用，稍后点重新上传。',
  };
  const uploadErrZh = e => UPLOAD_ERR_ZH[e && e.code] || ('上传失败（' + ((e && e.code) || '未知错误') + '）。录音还在，可以重新上传。');

  function init(el) {
    root = el;
    Bus.on('recordings', () => { if (visible) { renderList(); renderBanner(); } });
    Bus.on('config', () => { if (visible) renderBanner(); });
    Bus.on('nodeOpened', () => { if (built) renderPrompt(); });
  }
  function show() {
    visible = true;
    if (!built) build();
    renderPrompt(); renderStage(); renderBanner(); renderList();
  }
  function hide() { visible = false; }

  /* ---------------- 题目 ---------------- */
  function promptMode() { return ls.get('recPrompt', 'node'); }
  function currentPrompt() {
    const m = promptMode();
    if (m === 'intro') return { prompt: FIXED_PROMPTS.intro.en, fixedPrompt: 'intro', nodeId: null, label: FIXED_PROMPTS.intro.zh };
    if (m === 'custom') { const t = str(els.custom && els.custom.value); return { prompt: t || '（自定义题目）', fixedPrompt: null, nodeId: null, label: '自定义' }; }
    const n = S.nodeMap[Practice.currentNodeId];
    if (n && n.main_q) return { prompt: n.main_q, fixedPrompt: null, nodeId: n.id, label: n.id + ' ' + n.title_zh };
    return { prompt: FIXED_PROMPTS.intro.en, fixedPrompt: 'intro', nodeId: null, label: FIXED_PROMPTS.intro.zh };
  }

  function build() {
    built = true;
    els.banner = h('div', { class: 'notice info banner' });
    els.seg = h('div', { class: 'seg', role: 'group', 'aria-label': '题目' });
    els.promptText = h('p', { class: 'en' });
    els.promptLabel = h('p', { class: 'small muted' });
    els.custom = h('input', { type: 'text', id: 'rec-custom', class: 'en-s', placeholder: '写下题目，比如 Tell me about your hometown.', hidden: true, oninput: () => ls.set('recCustom', els.custom.value) });
    els.custom.value = ls.get('recCustom', '') || '';
    els.stage = h('div', { class: 'rec-stage' });
    els.result = h('div', { class: 'stack' });
    els.fileCap = h('input', { type: 'file', accept: 'audio/*', capture: '', id: 'rec-file-cap', hidden: true, onchange: onFile });
    els.filePick = h('input', { type: 'file', accept: 'audio/*,video/webm,video/mp4,.m4a,.amr,.aac,.3gp,.mp3,.wav,.ogg,.webm', id: 'rec-file-pick', hidden: true, onchange: onFile });
    els.list = h('ul', { class: 'rec-list' });
    put(clear(root), 
      els.banner,
      h('section', { class: 'card stack' },
        h('h2', { class: 'section-title' }, '录一段'),
        els.seg, h('div', { class: 'stack-s' }, els.promptLabel, els.promptText, els.custom),
        els.stage, els.result, els.fileCap, els.filePick),
      h('div', { class: 'row-between' }, h('h2', { class: 'section-title' }, '录音列表'), h('span', { class: 'small muted', id: 'rec-count' })),
      els.list,
      h('p', { class: 'small muted' }, '页面里录音和选文件都不行时：直接把录音文件作为附件发到 Claude 对话里，说"分析"。结果会出现在这个列表里。'));
  }

  function renderPrompt() {
    if (!built) return;
    const m = promptMode();
    put(clear(els.seg), ...[['node', '当前节点'], ['intro', '自我介绍'], ['custom', '自定义']].map(([k, t]) =>
      h('button', { type: 'button', 'aria-pressed': String(m === k), onclick: () => { ls.set('recPrompt', k); renderPrompt(); } }, t)));
    const p = currentPrompt();
    els.custom.hidden = m !== 'custom';
    els.promptText.hidden = m === 'custom';
    els.promptText.textContent = p.prompt;
    els.promptLabel.textContent = m === 'intro' ? '固定题，用来看流利度趋势' : m === 'custom' ? '自定义题目' : p.label;
  }

  /* ---------------- 录音方式 ---------------- */
  function route() {
    if (!Platform.blobs.available) return 'none';
    const forced = ls.get('recRoute');
    if (forced === 'file' || forced === 'page') return forced;
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || typeof MediaRecorder === 'undefined') return 'file';
    if (Probe.flags().gum === 'fail' || ls.get('micBlocked', false)) return 'file';
    return 'page';
  }

  function renderStage(errName) {
    if (!built) return;
    const st = clear(els.stage);
    const r = route();
    if (r === 'none') {
      put(st, h('div', { class: 'notice' }, Platform.store.available ? '这个视图不能上传录音：只有 artifact 的所有者和编辑者能上传。' : '需要在 Claude 的 artifact 查看器里打开才能上传录音。'));
      return;
    }
    if (r === 'page') {
      const max = S.config.maxRecSec || 180;
      els.recBtn = h('button', { class: 'rec-btn' + (live ? ' live' : ''), type: 'button', onclick: () => (live ? stopRec() : startRec()) }, live ? '停止' : '开始录音');
      els.timer = h('div', { class: 'timer', 'aria-live': 'off' }, '0:00 / ' + fmtDur(max));
      els.meterFill = h('span');
      put(st, els.recBtn, els.timer, h('div', { class: 'meter', 'aria-hidden': 'true' }, els.meterFill),
        live ? null : h('button', { class: 'link-btn', type: 'button', onclick: () => { ls.set('recRoute', 'file'); renderStage(); } }, '改用系统录音机'));
      return;
    }
    const canPage = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && typeof MediaRecorder !== 'undefined';
    put(st, 
      h('p', { class: 'small', style: 'text-align:center' }, errName ? '页面里用不了麦克风（' + errName + '）。' : ls.get('micBlocked', false) || Probe.flags().gum === 'fail' ? '这台设备上页面里用不了麦克风。' : '',
        '用手机自带的录音机录好，再传上来：'),
      h('div', { class: 'file-btns' },
        h('button', { class: 'btn', type: 'button', onclick: () => els.fileCap.click() }, '用系统录音机录'),
        h('button', { class: 'btn ghost', type: 'button', onclick: () => els.filePick.click() }, '选择录音文件')),
      canPage ? h('button', { class: 'link-btn', type: 'button', onclick: () => { ls.del('micBlocked'); ls.set('recRoute', 'page'); renderStage(); } }, '再试页面里录音') : null);
  }

  async function startRec() {
    if (live) return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      ls.set('micBlocked', true); ls.del('recRoute');
      renderStage(e.name || 'Error');
      return;
    }
    const mime = AudioTools.pickRecorderMime();
    let mr;
    try { mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : { audioBitsPerSecond: 64000 }); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); toast('无法开始录音：' + (e.name || e)); return; }
    const chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    live = { stream, mr, chunks, t0: performance.now(), snap: currentPrompt(), ctx: null, raf: 0, timer: 0, wake: null };
    mr.onstop = finishRec;
    mr.start(1000);
    renderStage();
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      live.ctx = new AC();
      const an = live.ctx.createAnalyser();
      an.fftSize = 1024;
      live.ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Float32Array(an.fftSize);
      const loop = () => {
        if (!live) return;
        an.getFloatTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
        const db = 20 * Math.log10(Math.sqrt(s / buf.length) + 1e-9);
        if (els.meterFill) els.meterFill.style.width = Math.max(0, Math.min(100, ((db + 60) / 55) * 100)) + '%';
        live.raf = requestAnimationFrame(loop);
      };
      loop();
    } catch (_) {}
    live.timer = setInterval(() => {
      if (!live) return;
      const sec = (performance.now() - live.t0) / 1000, max = S.config.maxRecSec || 180;
      if (els.timer) els.timer.textContent = fmtDur(sec) + ' / ' + fmtDur(max);
      if (sec >= max) stopRec();
    }, 250);
    try { if (navigator.wakeLock) live.wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  function stopRec() { if (live && live.mr.state !== 'inactive') live.mr.stop(); }
  function finishRec() {
    const r = live;
    live = null;
    if (!r) return;
    clearInterval(r.timer); cancelAnimationFrame(r.raf);
    r.stream.getTracks().forEach(t => t.stop());
    if (r.ctx) r.ctx.close().catch(() => {});
    if (r.wake && r.wake.release) r.wake.release().catch(() => {});
    const blob = new Blob(r.chunks, { type: r.mr.mimeType || 'audio/webm' });
    const durationSec = Math.round((performance.now() - r.t0) / 100) / 10;
    renderStage();
    if (!blob.size) { toast('没有录到声音'); return; }
    handleBlob(blob, { recMime: blob.type, durationSec, fileName: null, snap: r.snap });
  }

  function onFile(e) {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    handleBlob(f, { recMime: f.type || AudioTools.guessMime(f.name), fileName: f.name, durationSec: null, snap: currentPrompt() });
  }

  function mediaDuration(url) {
    return new Promise(res => {
      const a = new Audio();
      const done = v => { res(v); a.src = ''; };
      a.preload = 'metadata';
      a.onloadedmetadata = () => done(isFinite(a.duration) ? Math.round(a.duration * 10) / 10 : null);
      a.onerror = () => done(null);
      setTimeout(() => done(null), 4000);
      a.src = url;
    });
  }

  async function handleBlob(blob, meta) {
    const item = {
      id: uid('r'), blob, recMime: meta.recMime || '', fileName: meta.fileName, durationSec: meta.durationSec,
      snap: meta.snap, local: null, localFailed: false, state: 'local', error: null, uploaded: null,
      url: URL.createObjectURL(blob),
    };
    pending = item;
    renderResult();
    try {
      const a = await AudioTools.decode(blob);
      item.local = AudioTools.roughPauses(a.samples, a.sr, S.config.pauseSec || 0.5);
      if (!item.durationSec) item.durationSec = Math.round(a.duration * 10) / 10;
    } catch (_) {
      item.localFailed = true;
      if (!item.durationSec) item.durationSec = await mediaDuration(item.url);
    }
    renderResult();
    await upload(item);
  }

  async function upload(item) {
    item.state = 'uploading'; item.error = null;
    renderResult();
    try {
      await saveRecording({
        id: item.id, blob: item.blob, recMime: item.recMime, fileName: item.fileName, durationSec: item.durationSec, local: item.local,
        prompt: item.snap.prompt, fixedPrompt: item.snap.fixedPrompt, nodeId: item.snap.nodeId, turnId: null, uploaded: item.uploaded,
      }, s => { item.state = s; if (pending === item) renderResult(); });
      item.state = 'done';
    } catch (e) {
      item.state = 'failed'; item.error = e;
      if (e && e.uploaded) item.uploaded = e.uploaded;
    }
    if (pending === item) renderResult();
  }

  /* 上传并写 recordings（练习页"说一次就够"也用它） */
  async function saveRecording(o, onState) {
    const step = onState || (() => {});
    let up = o.uploaded;
    if (!up) { step('uploading'); up = await AudioTools.uploadRecording(o.blob, o.recMime, o.fileName); }
    step('saving');
    const id = o.id || uid('r');
    const doc = {
      nodeId: o.nodeId || null, prompt: o.prompt || '', fixedPrompt: o.fixedPrompt || null, turnId: o.turnId || null,
      assetId: up.res.id, uploadType: up.uploadType, recMime: o.recMime || '', durationSec: o.durationSec == null ? null : o.durationSec,
      sizeBytes: o.blob.size, fileName: o.fileName || null, local: o.local || null,
      status: 'pending', analysis: null, createdAt: nowIso(), analyzedAt: null,
    };
    try { await Platform.store.set('recordings/' + id, doc); }
    catch (e) { throw Object.assign({}, e, { uploaded: up }); }
    return { id, assetId: up.res.id };
  }

  function localStats(local, durationSec) {
    if (!local) return null;
    return h('div', { class: 'stack-s' },
      h('div', { class: 'stats' },
        stat(local.pauses, '停顿次数'),
        stat(local.longestPauseSec + ' 秒', '最长停顿'),
        stat(Math.round(local.speakingRatio * 100) + '%', '说话时间占比'),
        durationSec != null ? stat(fmtDur(durationSec), '时长') : null),
      h('p', { class: 'small muted' }, '粗测，以分析结果为准。', local.noisy ? '底噪比较大，粗测可能不准。' : ''));
  }
  function stat(v, k) { return h('div', { class: 'stat' }, h('span', { class: 'v mono' }, String(v)), h('span', { class: 'k' }, k)); }

  function renderResult() {
    if (!built) return;
    const box = clear(els.result), it = pending;
    if (!it) return;
    const status = {
      local: [h('span', { class: 'spin' }), ' 本地粗测中……'],
      uploading: [h('span', { class: 'spin' }), ' 上传中……'],
      saving: [h('span', { class: 'spin' }), ' 写入记录……'],
      done: [h('span', { class: 'chip ok' }, '已上传'), ' 等分析。录好几段后把上面那句话发给 Claude。'],
      failed: [h('span', { class: 'chip high' }, '没传上'), ' ', uploadErrZh(it.error)],
    }[it.state];
    put(box, 
      h('p', { class: 'label' }, '刚录的一段'),
      h('audio', { controls: true, src: it.url, preload: 'metadata' }),
      localStats(it.local, it.durationSec),
      it.localFailed ? h('p', { class: 'small muted' }, '这个格式在页面里解码不了，跳过粗测，直接上传。') : null,
      it.durationSec > (S.config.maxRecSec || 180) ? h('p', { class: 'small muted' }, '超过 3 分钟了，下次录短一点。') : null,
      h('p', { class: 'status row' }, ...status),
      it.state === 'failed' ? h('div', null, h('button', { class: 'btn ghost small', type: 'button', onclick: () => upload(it) }, '重新上传')) : null);
  }

  /* ---------------- 提示横幅 ---------------- */
  function renderBanner() {
    if (!built) return;
    const pend = S.recordings.filter(r => r.status === 'pending').length;
    const analyzing = S.recordings.filter(r => r.status === 'analyzing').length;
    const url = S.config.artifactUrl;
    const text = '请分析口语特训的新录音：' + (url || '（这个页面的地址）');
    const code = h('code', null, text);
    put(clear(els.banner), 
      h('p', null, pend ? h('b', null, '有 ' + pend + ' 段待分析。') : null, analyzing ? ' ' + analyzing + ' 段正在分析。' : null, ' 录好几段后，把下面这句话发给 Claude：'),
      h('div', { class: 'copy-line' }, code, h('button', { class: 'btn small', type: 'button', onclick: () => copyText(text, code) }, '复制')));
  }

  /* ---------------- 列表 ---------------- */
  const REC_STATUS = { pending: ['待分析', 'warn'], analyzing: ['分析中', 'accent'], analyzed: ['已分析', 'ok'], failed: ['失败', 'high'] };

  function renderList() {
    if (!built) return;
    const recs = S.recordings;
    const cnt = $('#rec-count');
    if (cnt) cnt.textContent = recs.length ? recs.length + ' 段' : '';
    clear(els.list);
    if (!recs.length) { put(els.list, h('li', { class: 'muted' }, S.loaded.recordings ? '还没有录音。' : '读取中……')); return; }
    for (const r of recs) {
      const [label, cls] = REC_STATUS[r.status] || [r.status, ''];
      const open = expanded.has(r.id);
      const head = h('button', { class: 'rec-head', type: 'button', 'aria-expanded': String(open), onclick: () => { if (expanded.has(r.id)) expanded.delete(r.id); else expanded.add(r.id); renderList(); } },
        h('span', { class: 'rp' }, r.prompt || '（没有题目）'),
        h('span', { class: 'rm' }, [fmtWhen(r.createdAt), r.durationSec != null ? fmtDur(r.durationSec) : null, r.fixedPrompt === 'intro' ? '固定题' : null, r.nodeId, r.turnId ? '随文字作答录下' : null].filter(Boolean).join(' · ')),
        h('span', { class: 'chip ' + cls }, label));
      put(els.list, h('li', { class: 'rec-item' }, head, open ? cachedBody(r) : null));
    }
  }

  function cachedBody(r) {
    const key = [r.status, r.analyzedAt, r.assetId, r.error].join('|');
    const c = bodyCache.get(r.id);
    if (c && c.key === key) return c.el;
    const el = recBody(r);
    bodyCache.set(r.id, { key, el });
    return el;
  }

  function player(r) {
    if (!r.assetId) return h('p', { class: 'small muted' }, r.audioDeletedAt ? '音频已删除，分析结果保留。' : '没有音频文件（来自对话附件）。');
    const box = h('div');
    if (r.uploadType === 'text/plain') {
      const load = async () => {
        put(clear(box), h('p', { class: 'small muted' }, '加载中……'));
        try {
          if (!blobUrls[r.id]) blobUrls[r.id] = URL.createObjectURL(AudioTools.base64ToBlob(await Platform.blobs.fetchText(r.assetId), r.recMime));
          put(clear(box), h('audio', { controls: true, src: blobUrls[r.id] }));
        } catch (e) { put(clear(box), h('p', { class: 'small muted' }, '加载失败（' + (e.code || e.message || e) + '）')); }
      };
      put(box, h('button', { class: 'btn ghost small', type: 'button', onclick: load }, '加载音频'));
      return box;
    }
    const src = Platform.blobs.url(r.assetId);
    const audio = h('audio', { controls: true, preload: 'none', src });
    audio.addEventListener('error', () => { put(clear(box), h('video', { controls: true, preload: 'metadata', playsinline: true, src })); }, { once: true });
    put(box, audio);
    return box;
  }

  const LC_KIND = { grammar: '语法错误处', pronunciation: '发音问题', unclear: '没说清' };

  function analysisView(r) {
    const a = r.analysis || {};
    const lowConf = S.config.lowConf || 0.6;
    const kinds = {}, notes = {}, pausesAfter = {};
    arr(a.pause_kinds).forEach(k => { kinds[k.after_index] = k.kind; });
    arr(a.lowconf_notes).forEach(n => { notes[n.index] = n; });
    arr(a.pauses).forEach(p => { pausesAfter[p.after_index] = p; });
    const lowIdx = new Set(arr(a.low_confidence).map(x => x.index));
    const note = h('div', { class: 'lc-note', hidden: true, role: 'status' });
    const tr = h('p', { class: 'transcript' });
    const words = arr(a.words);
    if (words.length) {
      words.forEach((w, i) => {
        const low = lowIdx.has(i) || (typeof w.c === 'number' && w.c < lowConf);
        const showNote = () => {
          const n = notes[i];
          put(clear(note), h('b', { class: 'en-s' }, w.w), ' 置信度 ' + (typeof w.c === 'number' ? w.c.toFixed(2) : '?') + '。',
            n ? [' ' + (LC_KIND[n.kind] || n.kind || '') + (n.target ? '，原本想说 ' : ''), n.target ? h('span', { class: 'en-s' }, n.target) : null, n.note_zh ? '。' + n.note_zh : ''] : ' 机器没听清这个词。');
          note.hidden = false;
        };
        put(tr, low ? h('span', { class: 'w low', tabindex: '0', role: 'button', onclick: showNote, onkeydown: e => { if (e.key === 'Enter') showNote(); } }, w.w) : h('span', { class: 'w' }, w.w), ' ');
        const p = pausesAfter[i];
        if (p) {
          const kind = kinds[i] || (p.after_punct ? 'boundary' : 'mid');
          put(tr, h('span', { class: 'pz ' + kind, title: kind === 'mid' ? '句中卡壳' : '句间停顿' }, '‖' + Number(p.sec).toFixed(1) + 's‖'), ' ');
        }
      });
    } else tr.textContent = a.text || '（没有转写）';
    const n = v => (v == null ? '–' : v);
    return h('div', { class: 'stack' },
      h('p', { class: 'label' }, '转写'),
      tr,
      h('div', { class: 'legend' }, h('span', null, h('span', { class: 'pz mid' }, '‖1.2s‖'), ' 句中卡壳'), h('span', null, h('span', { class: 'pz' }, '‖0.8s‖'), ' 句间停顿'), h('span', null, h('span', { class: 'transcript' }, h('span', { class: 'w low' }, 'word')), ' 机器没听清，点开看说明')),
      note,
      h('div', { class: 'stats' },
        stat(n(a.wpm), '语速（词/分）'),
        stat(n(a.wpm_excl_pauses), '去掉停顿后的语速'),
        stat(n(a.pauses_per_min), '每分钟停顿'),
        stat(n(a.mean_length_of_run), '平均连续词数'),
        stat(a.longest_pause_s == null ? '–' : a.longest_pause_s + ' 秒', '最长停顿')),
      a.pause_method === 'word_gaps' ? h('p', { class: 'small muted' }, '底噪太大，停顿按词与词的间隔估算，会偏短。') : null,
      h('div', { class: 'fb' }, errorsBlock(a.errors)),
      a.summary_zh ? h('div', { class: 'notice info', style: 'white-space:pre-wrap' }, a.summary_zh) : null);
  }

  function recBody(r) {
    const body = h('div', { class: 'rec-body' });
    put(body, player(r));
    if (r.status === 'analyzed' && r.analysis) put(body, analysisView(r));
    else if (r.status === 'failed') put(body, h('div', { class: 'notice bad' }, '分析失败' + (r.error ? '：' + r.error : '') + '。在对话里说"重试失败的录音"。'));
    else if (r.status === 'analyzing') put(body, h('p', { class: 'small muted' }, 'Claude 正在分析……'));
    else put(body, h('p', { class: 'small muted' }, '还没分析。把上面那句话发给 Claude。'));
    if (r.local && r.status !== 'analyzed') put(body, localStats(r.local, r.durationSec));
    put(body, deleteControls(r));
    return body;
  }

  function deleteControls(r) {
    const box = h('div', { class: 'row' });
    const analyzed = r.status === 'analyzed';
    if (analyzed && !r.assetId) return box;
    const label = analyzed ? '删除音频（保留分析结果）' : '删除这条录音';
    const ask = () => {
      put(clear(box), h('span', { class: 'small' }, analyzed ? '删掉音频后不能再回放。' : '录音和记录都会删掉。'),
        h('button', { class: 'btn danger small', type: 'button', onclick: doDelete }, '确认删除'),
        h('button', { class: 'btn quiet small', type: 'button', onclick: () => put(clear(box), first()) }, '取消'));
    };
    const first = () => h('button', { class: 'btn quiet small', type: 'button', onclick: ask }, label);
    const doDelete = async () => {
      if (!Platform.blobs.available) { toast('这个视图不能删除文件'); return; }
      put(clear(box), h('span', { class: 'spin' }));
      try {
        if (r.assetId) await Platform.blobs.remove(r.assetId);
        if (analyzed) await Platform.store.update('recordings/' + r.id, { assetId: null, audioDeletedAt: nowIso() });
        else { await Platform.store.remove('recordings/' + r.id); expanded.delete(r.id); }
        toast('已删除');
      } catch (e) { toast('删除失败：' + (e.code || e)); put(clear(box), first()); }
    };
    put(box, first());
    return box;
  }

  return { init, show, hide, saveRecording };
})();

/* ---- dash.js ---- */
/* =====================================================================
 * 看板：前三类错误（每百词、近 7 天对比之前）、全部类型、反问率、流利度趋势
 * ===================================================================== */

const Dash = (() => {
  let root = null, visible = false, usage = null, usageErr = null, usageAt = 0;

  function init(el) {
    root = el;
    ['turns', 'recordings', 'sessions', 'vocab'].forEach(k => Bus.on(k, () => { if (visible) render(); }));
  }
  function show() {
    visible = true;
    render();
    if (Platform.blobs.available && Date.now() - usageAt > 60000) {
      usageAt = Date.now();
      Platform.blobs.usage().then(u => { usage = u; usageErr = null; if (visible) render(); }, e => { usageErr = e; if (visible) render(); });
    }
  }
  function hide() { visible = false; }

  function ratesOf(units) {
    const words = units.reduce((a, u) => a + (u.words || 0), 0);
    const list = Data.tallyErrors(units.flatMap(u => u.errors));
    return { words, list, byType: Object.fromEntries(list.map(x => [x.type, x])) };
  }
  const per100 = (x, words) => (x && words ? (x.count / words) * 100 : 0);
  const f1 = v => (v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1));

  function render() {
    if (!root) return;
    if (!Platform.store.available) { put(clear(root), h('div', { class: 'notice bad' }, '没有连上数据库。')); return; }
    const units = Data.answerUnits().sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const cutoff = Date.now() - 7 * 86400000;
    const recent = units.filter(u => new Date(u.at).getTime() >= cutoff);
    const before = units.filter(u => new Date(u.at).getTime() < cutoff);
    const A = ratesOf(units), R = ratesOf(recent), B = ratesOf(before);

    put(clear(root),
      h('div', { class: 'kpis' },
        kpi(S.turns.length, '条回答'),
        kpi(S.sessions.filter(s => s.endedAt).length, '次练习'),
        kpi(S.recordings.length, '段录音')),
      topErrors(A, R, B),
      askBack(),
      fluency(),
      allTypes(A),
      lastSessions(),
      footer());
  }

  function kpi(v, k) { return h('div', { class: 'kpi' }, h('span', { class: 'v' }, String(v)), h('span', { class: 'k' }, k)); }
  function card(title, sub, ...kids) {
    return h('section', { class: 'card stack' }, h('div', { class: 'row-between' }, h('h2', { class: 'section-title' }, title), sub ? h('span', { class: 'small muted' }, sub) : null), ...kids);
  }

  function topErrors(A, R, B) {
    if (!A.list.length) return card('前三类错误', null, h('p', { class: 'muted' }, '还没有错误记录。练完几句，这里就有数了。'));
    const base = R.words ? R : A;
    const ranked = base.list.slice().sort((a, b) => per100(b, base.words) - per100(a, base.words) || b.high - a.high).slice(0, 3);
    return card('前三类错误', R.words ? '按每百词次数，近 7 天' : '按每百词次数，全部',
      h('div', { class: 'top-errs' }, ranked.map((x, i) => {
        const t = ERROR_MAP[x.type];
        const rr = R.words ? per100(R.byType[x.type], R.words) : null;
        const rb = B.words ? per100(B.byType[x.type], B.words) : null;
        const ex = A.byType[x.type] || x;
        let trend = null;
        if (rr != null && rb != null) {
          const d = rr - rb;
          trend = Math.abs(d) < 0.05 ? h('span', null, '持平') : d > 0 ? h('span', { class: 'trend-up' }, '↑ 变多') : h('span', { class: 'trend-down' }, '↓ 变少');
        }
        return h('div', { class: 'top-err' },
          h('span', { class: 'rank' }, String(i + 1)),
          h('div', null, h('span', { class: 't' }, t ? t.name : x.type), ' ', h('span', { class: 'mono small muted' }, x.type)),
          h('div', { class: 'rate' },
            h('div', null, h('b', { class: 'mono' }, f1(rr != null ? rr : per100(A.byType[x.type], A.words))), ' / 百词'),
            rb != null ? h('div', null, '之前 ', h('span', { class: 'mono' }, f1(rb)), ' ', trend) : null),
          ex.example_orig || ex.example_fix ? h('p', { class: 'ex' }, ex.example_orig ? h('s', null, ex.example_orig) : null, ex.example_orig ? ' → ' : '', ex.example_fix) : null);
      })));
  }

  function askBack() {
    const social = S.turns.filter(t => { const n = S.nodeMap[t.nodeId]; return n && n.track === 'social'; }).slice(-20);
    if (!social.length) return card('反问率', null, h('p', { class: 'muted' }, '社交场景还没有作答。'));
    const yes = social.filter(t => t.asked_back).length;
    const pct = Math.round((yes / social.length) * 100);
    return card('反问率', '社交场景最近 ' + social.length + ' 条',
      h('div', { class: 'row-between' }, h('span', { class: 'kpi-v', style: 'font-size:28px;font-weight:700' }, pct + '%'), h('span', { class: 'small muted' }, yes + ' 条以提问结尾')),
      h('div', { class: 'meter-bar', role: 'img', 'aria-label': '反问率 ' + pct + '%' }, h('span', { style: 'width:' + pct + '%' })),
      pct < 50 ? h('p', { class: 'small' }, '答完别停：加一句 ', h('span', { class: 'en-s' }, 'What about you?'), ' 就能把话题接下去。') : null);
  }

  /* 固定题"一分钟自我介绍"的趋势：单序列迷你折线，悬停看每个点 */
  function fluency() {
    const recs = S.recordings.filter(r => r.fixedPrompt === 'intro' && r.status === 'analyzed' && r.analysis)
      .slice().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
    if (!recs.length) return card('流利度趋势', '一分钟自我介绍', h('p', { class: 'muted' }, '在"录音"里选"一分钟自我介绍"录几次，分析后这里显示语速、停顿和连续词数的变化。'));
    const metrics = [
      { key: 'wpm', name: '语速', unit: '词/分', better: 'up' },
      { key: 'pauses_per_min', name: '每分钟停顿', unit: '次', better: 'down' },
      { key: 'mean_length_of_run', name: '平均连续词数', unit: '词', better: 'up' },
    ];
    return card('流利度趋势', '一分钟自我介绍 · ' + recs.length + ' 次',
      h('div', { class: 'spark-grid' }, metrics.map(m => {
        const pts = recs.map(r => ({ v: Number(r.analysis[m.key]), at: r.createdAt })).filter(p => isFinite(p.v));
        if (!pts.length) return null;
        const last = pts[pts.length - 1].v, first = pts[0].v;
        let delta = null;
        if (pts.length > 1) {
          const d = last - first;
          const good = m.better === 'up' ? d > 0 : d < 0;
          delta = h('span', { class: 'small ' + (Math.abs(d) < 0.05 ? 'muted' : good ? 'trend-down' : 'trend-up') }, (d > 0 ? '+' : '') + f1(d) + (Math.abs(d) < 0.05 ? '' : good ? ' 更好' : ' 变差'));
        }
        return h('div', { class: 'spark' },
          h('span', { class: 'k' }, m.name + '（' + m.unit + '）'),
          h('div', { class: 'row' }, h('span', { class: 'v mono' }, f1(last)), delta),
          pts.length > 1 ? sparkline(pts, m) : h('span', { class: 'small muted' }, '录满 2 次后显示趋势'));
      })));
  }

  function sparkline(pts, m) {
    const W = 220, H = 52, px = 5, py = 6;
    const vs = pts.map(p => p.v);
    let min = Math.min(...vs), max = Math.max(...vs);
    if (max - min < 1e-6) { min -= 1; max += 1; }
    const x = i => px + (i * (W - 2 * px)) / (pts.length - 1);
    const y = v => H - py - ((v - min) / (max - min)) * (H - 2 * py);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
    const area = line + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - py) + ' L' + x(0).toFixed(1) + ' ' + (H - py) + ' Z';
    const tip = h('span', { class: 'tip', hidden: true });
    const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid meet', role: 'img', 'aria-label': m.name + '：' + pts.map(p => f1(p.v)).join('，') },
      svgEl('line', { class: 'sp-grid', x1: px, x2: W - px, y1: H - py, y2: H - py }),
      svgEl('path', { class: 'sp-area', d: area }),
      svgEl('path', { class: 'sp-line', d: line }),
      svgEl('circle', { class: 'sp-dot', cx: x(pts.length - 1), cy: y(pts[pts.length - 1].v), r: 4 }));
    const hover = svgEl('circle', { class: 'sp-hover', r: 4, cx: 0, cy: 0, visibility: 'hidden' });
    svg.append(hover);
    const step = (W - 2 * px) / (pts.length - 1);
    pts.forEach((p, i) => {
      const hit = svgEl('rect', { class: 'sp-hit', x: x(i) - step / 2, y: 0, width: step, height: H });
      const on = () => { hover.setAttribute('cx', x(i)); hover.setAttribute('cy', y(p.v)); hover.setAttribute('visibility', 'visible'); tip.textContent = fmtWhen(p.at) + ' · ' + f1(p.v); tip.hidden = false; };
      hit.addEventListener('pointerenter', on);
      hit.addEventListener('pointerdown', on);
      hit.addEventListener('pointerleave', () => { tip.hidden = true; hover.setAttribute('visibility', 'hidden'); });
      svg.append(hit);
    });
    return h('div', { style: 'position:relative' }, svg, tip);
  }

  function allTypes(A) {
    const rows = ERROR_TYPES.map(t => ({ t, x: A.byType[t.code] || { count: 0, high: 0 } }))
      .sort((a, b) => b.x.count - a.x.count);
    return card('全部错误类型', A.words ? '共 ' + A.words + ' 词' : null,
      h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
        h('thead', null, h('tr', null, h('th', null, '类型'), h('th', null, '代码'), h('th', { class: 'num' }, '次数'), h('th', { class: 'num' }, 'high 占比'))),
        h('tbody', null, rows.map(({ t, x }) => h('tr', { class: x.count ? '' : 'zero' },
          h('td', null, t.name), h('td', { class: 'mono' }, t.code), h('td', { class: 'num mono' }, String(x.count)),
          h('td', { class: 'num mono' }, x.count ? Math.round((x.high / x.count) * 100) + '%' : '–')))))));
  }

  function lastSessions() {
    const done = S.sessions.filter(s => s.endedAt && s.summary).slice(0, 3);
    if (!done.length) return null;
    return card('最近的练习小结', null, h('div', { class: 'stack' }, done.map(s => h('div', { class: 'stack-s' },
      h('p', { class: 'small muted' }, s.id + ' · ' + (s.summary.nTurns || 0) + ' 条回答'),
      arr(s.summary.top).length ? h('p', null, s.summary.top.map(t => (ERROR_MAP[t.type] ? ERROR_MAP[t.type].name : t.type) + ' ×' + t.count).join('，')) : h('p', { class: 'muted' }, '没有发现错误'),
      s.summary.rule_zh ? h('p', { class: 'notice info' }, h('b', null, '口诀：'), s.summary.rule_zh) : null))));
  }

  function footer() {
    const u = usage;
    return card('其他', null,
      h('div', { class: 'row-between' }, h('span', null, '词汇缺口'), h('button', { class: 'link-btn', type: 'button', onclick: () => App.go('pocket') }, S.vocab.length + ' 个 · 去口袋本')),
      Platform.blobs.available ? h('div', { class: 'stack-s' },
        h('div', { class: 'row-between' }, h('span', null, '录音存储'),
          h('span', { class: 'small mono' }, u ? fmtBytes(u.bytes) + ' / ' + fmtBytes(u.maxBytes) + ' · ' + u.files + ' / ' + u.maxFiles + ' 个文件' : usageErr ? '读取失败' : '读取中……')),
        u ? h('div', { class: 'meter-bar' }, h('span', { style: 'width:' + Math.min(100, Math.round((u.bytes / Math.max(1, u.maxBytes)) * 100)) + '%' })) : null) : null);
  }

  return { init, show, hide };
})();

/* ---- pocket.js ---- */
/* =====================================================================
 * 口袋本：最佳回答（可编辑）、词汇缺口、听力清单、前三类错误和口诀；导出离线 HTML
 * ===================================================================== */

const Pocket = (() => {
  let root = null, visible = false, editing = null;

  function init(el) {
    root = el;
    ['bank', 'vocab', 'nodes', 'turns', 'sessions', 'recordings'].forEach(k => Bus.on(k, () => { if (visible && !editing) render(); }));
  }
  function show() { visible = true; render(); }
  function hide() { visible = false; }

  function myTop() {
    const all = Data.answerUnits().sort((a, b) => String(a.at).localeCompare(String(b.at))).flatMap(u => u.errors);
    const top = Data.tallyErrors(all).slice(0, 3);
    const last = S.sessions.find(s => s.endedAt && s.summary && s.summary.rule_zh);
    return { top, rule: last ? last.summary.rule_zh : '', focus: last ? arr(last.summary.next_focus_zh) : [] };
  }

  function render() {
    if (!root) return;
    if (!Platform.store.available) { put(clear(root), h('div', { class: 'notice bad' }, '没有连上数据库。')); return; }
    const practiced = S.nodes.filter(n => n.track !== 'listening');
    const withBank = practiced.filter(n => S.bank[n.id]);
    const without = practiced.filter(n => !S.bank[n.id]);
    const mt = myTop();
    put(clear(root),
      h('div', { class: 'row-between' },
        h('h2', { class: 'section-title' }, '口袋本'),
        Platform.blobs.canSave ? h('button', { class: 'btn', type: 'button', onclick: exportPocket }, '导出离线版') : h('span', { class: 'small muted' }, '这个视图不能导出文件')),
      h('p', { class: 'small muted' }, '导出的是一个 HTML 文件，存在手机里，没网也能打开。出发前（10/16）记得导出一次最新的。'),

      h('section', { class: 'card stack' },
        h('h3', { class: 'section-title' }, '我的前三类错误'),
        mt.top.length ? h('div', { class: 'top-errs' }, mt.top.map((x, i) => h('div', { class: 'top-err' },
          h('span', { class: 'rank' }, String(i + 1)),
          h('div', null, h('span', { class: 't' }, ERROR_MAP[x.type] ? ERROR_MAP[x.type].name : x.type), h('span', { class: 'small muted' }, ' ×' + x.count)),
          h('span'),
          h('p', { class: 'ex' }, x.example_orig ? h('s', null, x.example_orig) : null, x.example_orig ? ' → ' : '', x.example_fix),
          x.note_zh ? h('p', { class: 'small', style: 'grid-column:2 / span 2' }, x.note_zh) : null))) : h('p', { class: 'muted' }, '还没有错误记录。'),
        mt.rule ? h('p', { class: 'notice info' }, h('b', null, '口诀：'), mt.rule) : null,
        mt.focus.length ? h('p', { class: 'small' }, '下次重点：' + mt.focus.join('；')) : null),

      h('section', { class: 'card stack' },
        h('h3', { class: 'section-title' }, '最佳回答 ', h('span', { class: 'muted' }, withBank.length + '/' + practiced.length)),
        withBank.length ? withBank.map(bankItem) : h('p', { class: 'muted' }, '还没有。在练习页练完一个节点，点"这个节点练完了"，最佳回答会存到这里。'),
        without.length ? h('p', { class: 'small muted' }, '还没整理：' + without.map(n => n.id + ' ' + n.title_zh).join('、')) : null),

      h('section', { class: 'card stack' },
        h('h3', { class: 'section-title' }, '词汇缺口 ', h('span', { class: 'muted' }, S.vocab.length + ' 个')),
        S.vocab.length ? h('div', { class: 'phrase-list' }, S.vocab.map(vocabRow)) : h('p', { class: 'muted' }, '作答时卡住直接说中文，Claude 会把这些词记到这里。')),

      h('section', { class: 'card stack' },
        h('h3', { class: 'section-title' }, '听力清单'),
        TRACKS.map(tr => {
          const ns = S.nodes.filter(n => n.track === tr.id && arr(n.listen).length);
          if (!ns.length) return null;
          return h('details', { class: 'listen' }, h('summary', null, tr.name + ' · ' + ns.reduce((a, n) => a + n.listen.length, 0) + ' 条'),
            h('div', { class: 'listen-body' }, ns.map(n => h('div', { class: 'stack-s' },
              h('p', { class: 'label' }, n.id + ' ' + n.title_zh),
              h('div', { class: 'phrase-list' }, n.listen.map(l => h('div', { class: 'phrase' },
                h('p', { class: 'en-s' }, l.en),
                h('p', { class: 'zh' }, l.zh || '', l.note ? h('span', { class: 'note' }, ' · ' + l.note) : null),
                l.tts === false ? h('span') : sayBtn(l.en))))))));
        })));
  }

  function bankItem(n) {
    const b = S.bank[n.id];
    const box = h('div', { class: 'bank-item' });
    const view = () => put(clear(box),
      h('div', { class: 'row-between' }, h('b', null, n.id + ' ' + n.title_zh), h('span', { class: 'small muted' }, b.edited ? '已手动修改' : '')),
      n.main_q ? h('p', { class: 'small muted en-s' }, n.main_q) : null,
      h('div', { class: 'row', style: 'align-items:flex-start;flex-wrap:nowrap' }, h('p', { class: 'en', style: 'flex:1' }, b.best_en), sayBtn(b.best_en)),
      arr(b.chunks).length ? h('div', { class: 'chunks' }, b.chunks.map(c => h('div', { class: 'chunk' }, h('span', { class: 'en-s' }, c.en), h('span', { class: 'zh' }, c.zh || ''), sayBtn(c.en)))) : null,
      h('div', null, h('button', { class: 'btn quiet small', type: 'button', onclick: edit }, '修改')));
    const edit = () => {
      editing = n.id;
      const ta = h('textarea', { class: 'en', id: 'bank-edit-' + n.id, rows: 4 });
      ta.value = b.best_en;
      put(clear(box), h('b', null, n.id + ' ' + n.title_zh), ta,
        h('div', { class: 'row' },
          h('button', { class: 'btn small', type: 'button', onclick: async () => {
            const v = ta.value.trim();
            if (!v) return;
            try { await Platform.store.update('bank/' + n.id, { best_en: v, edited: true, updatedAt: nowIso() }); toast('已保存'); }
            catch (e) { toast('没存上：' + (e.code || e)); return; }
            editing = null; render();
          } }, '保存'),
          h('button', { class: 'btn quiet small', type: 'button', onclick: () => { editing = null; render(); } }, '取消')));
      ta.focus();
    };
    view();
    return box;
  }

  function vocabRow(v) {
    return h('div', { class: 'phrase' },
      h('p', { class: 'en-s' }, v.en, h('span', { class: 'muted' }, '  ' + v.zh)),
      h('p', { class: 'zh' }, v.example || '', ' ',
        h('button', { class: 'link-btn', type: 'button', onclick: () => Platform.store.remove('vocab/' + v.id).then(() => toast('已删除'), e => toast('删除失败：' + (e.code || e))) }, '删除')),
      sayBtn(v.example || v.en));
  }

  /* ---------------- 导出离线 HTML ---------------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const say = t => '<button class="say" data-t="' + esc(t) + '" aria-label="朗读">▶</button>';

  function buildHtml() {
    const mt = myTop();
    const parts = [];
    parts.push('<h1>口语口袋本</h1><p class="m">导出于 ' + esc(localDate()) + ' · ' + esc(S.config.tripStart ? '入境 ' + S.config.tripStart : '') + '</p>');
    parts.push('<h2>我的前三类错误</h2>');
    if (mt.top.length) {
      parts.push('<ol>' + mt.top.map(x => '<li><b>' + esc(ERROR_MAP[x.type] ? ERROR_MAP[x.type].name : x.type) + '</b> ×' + x.count +
        '<div class="en"><s>' + esc(x.example_orig) + '</s> → ' + esc(x.example_fix) + '</div>' + (x.note_zh ? '<div class="m">' + esc(x.note_zh) + '</div>' : '') + '</li>').join('') + '</ol>');
    } else parts.push('<p class="m">还没有记录。</p>');
    if (mt.rule) parts.push('<p class="rule"><b>口诀：</b>' + esc(mt.rule) + '</p>');

    parts.push('<h2>最佳回答</h2>');
    const nodes = S.nodes.filter(n => n.track !== 'listening');
    for (const n of nodes) {
      const b = S.bank[n.id];
      if (!b) continue;
      parts.push('<section><h3>' + esc(n.id + ' ' + n.title_zh) + '</h3>' + (n.main_q ? '<p class="q">' + esc(n.main_q) + ' ' + say(n.main_q) + '</p>' : '') +
        '<p class="en best">' + esc(b.best_en) + ' ' + say(b.best_en) + '</p>' +
        (arr(b.chunks).length ? '<ul class="chunks">' + b.chunks.map(c => '<li><span class="en">' + esc(c.en) + '</span> ' + say(c.en) + '<br><span class="m">' + esc(c.zh) + '</span></li>').join('') + '</ul>' : '') + '</section>');
    }
    const svc = S.nodes.filter(n => arr(n.say).length);
    if (svc.length) {
      parts.push('<h2>办事时要说的话</h2>');
      for (const n of svc) parts.push('<section><h3>' + esc(n.id + ' ' + n.title_zh) + '</h3><ul>' + n.say.map(s => '<li class="en">' + esc(s) + ' ' + say(s) + '</li>').join('') + '</ul></section>');
    }
    if (S.vocab.length) {
      parts.push('<h2>词汇缺口</h2><ul>' + S.vocab.map(v => '<li><span class="en">' + esc(v.en) + '</span> ' + say(v.en) + ' <span class="m">' + esc(v.zh) + '</span>' + (v.example ? '<div class="en m">' + esc(v.example) + '</div>' : '') + '</li>').join('') + '</ul>');
    }
    parts.push('<h2>听力清单</h2>');
    for (const n of S.nodes.filter(n => arr(n.listen).length)) {
      parts.push('<section><h3>' + esc(n.id + ' ' + n.title_zh) + '</h3><ul>' + n.listen.map(l => '<li><span class="en">' + esc(l.en) + '</span>' + (l.tts === false ? '' : ' ' + say(l.en)) + '<br><span class="m">' + esc(l.zh) + (l.note ? ' · ' + esc(l.note) : '') + '</span></li>').join('') + '</ul></section>');
    }
    const css = ':root{color-scheme:light dark;--bg:#F1F3F7;--ink:#14203A;--m:#56627A;--line:#D4DAE4;--acc:#1E4D8C;--hi:#B0382A;--card:#fff}' +
      '@media (prefers-color-scheme:dark){:root{--bg:#0E1420;--ink:#E6EAF2;--m:#A8B3C7;--line:#2B3751;--acc:#8FB3EC;--hi:#F2978B;--card:#161F31}}' +
      'body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"HarmonyOS Sans SC","PingFang SC","Noto Sans SC",sans-serif}' +
      'main{max-width:680px;margin:0 auto}h1{font-size:22px;margin:0}h2{font-size:17px;margin:28px 0 8px;padding-top:12px;border-top:2px solid var(--acc)}h3{font-size:15px;margin:14px 0 4px}' +
      'section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}' +
      '.en{font-family:Georgia,"Noto Serif",serif;font-size:17px}.best{font-size:18px}.q{color:var(--m);font-family:Georgia,serif}.m{color:var(--m);font-size:14px}' +
      's{color:var(--hi)}ul,ol{padding-left:20px;margin:6px 0}li{margin:6px 0}.rule{background:var(--card);border-left:4px solid #F0B40A;padding:8px 12px;border-radius:6px}' +
      '.say{border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:50%;width:28px;height:28px;font-size:11px;cursor:pointer;vertical-align:middle}.no-tts .say{display:none}';
    const js = '(function(){var s=window.speechSynthesis;function v(){var a=s?s.getVoices():[];return a.filter(function(x){return /^en/i.test(x.lang)})[0]||null}' +
      'if(!s){document.documentElement.className="no-tts";return}document.addEventListener("click",function(e){var b=e.target.closest(".say");if(!b)return;s.cancel();var u=new SpeechSynthesisUtterance(b.getAttribute("data-t"));var x=v();if(x){u.voice=x;u.lang=x.lang}else u.lang="en-US";u.rate=0.95;s.speak(u)})})();';
    return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口语口袋本</title><style>' + css + '</style></head><body><main>' + parts.join('\n') + '</main><script>' + js + '<\/script></body></html>';
  }

  async function exportPocket() {
    try {
      const r = await Platform.blobs.saveFile('口语口袋本-' + localDate() + '.html', buildHtml());
      toast(r && r.status === 'delivered' ? '已交出' : '已保存');
    } catch (e) {
      toast(e.code === 'declined' ? '已取消' : e.code === 'rate_limited' ? '已经有一个保存框开着了' : '导出失败：' + (e.code || e));
    }
  }

  return { init, show, hide };
})();

/* ---- settings.js ---- */
/* =====================================================================
 * 设置：我的素材、练习偏好、导出全部数据、诊断（M0 探针）、关于
 * ===================================================================== */

const Settings = (() => {
  let root = null, built = false;
  const els = {};

  function init(el) {
    root = el;
    Bus.on('profile', () => { if (built) renderProfile(); });
    Bus.on('profileDraft', () => { if (built) renderProfile(); });
    Bus.on('config', () => { if (built) renderAbout(); });
    TTS.onChange(() => { if (built) renderPrefs(); });
  }

  function show(anchor) {
    if (!built) build();
    renderProfile(); renderPrefs(); renderAbout();
    if (anchor === 'probe' && els.probeCard) els.probeCard.scrollIntoView({ block: 'start' });
    else window.scrollTo(0, 0);
  }
  function hide() {}

  function build() {
    built = true;
    els.profile = h('section', { class: 'card stack' });
    els.prefs = h('section', { class: 'card stack' });
    els.data = h('section', { class: 'card stack' });
    els.probe = h('div');
    els.probeCard = h('section', { class: 'card stack', id: 'probe' }, h('h2', { class: 'section-title' }, '诊断'), h('p', { class: 'small muted' }, '检测这台设备能不能在页面里录音、上传、调用 Claude、朗读和语音识别。换设备或换 App 时再测一次。'), els.probe);
    els.about = h('section', { class: 'card stack' });
    put(clear(root),
      h('div', { class: 'row-between' }, h('button', { class: 'link-btn', type: 'button', onclick: () => App.back() }, '← 返回'), h('h2', { class: 'section-title' }, '设置')),
      els.profile, els.prefs, els.data, els.probeCard, els.about);
    renderData();
    Probe.mount(els.probe);
  }

  /* ---------------- 我的素材 ---------------- */
  function renderProfile() {
    const confirmed = !!S.profile;
    const facts = confirmed ? arr(S.profile.facts) : arr(S.profileDraft && S.profileDraft.facts);
    const ta = h('textarea', { id: 'profile-facts', rows: 7 });
    ta.value = facts.join('\n');
    const save = async () => {
      const list = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
      try { await Platform.store.set('me/profile', { facts: list, updatedAt: nowIso() }); toast('已保存'); }
      catch (e) { toast('没存上：' + (e.code || e)); }
    };
    put(clear(els.profile),
      h('h2', { class: 'section-title' }, '我的素材'),
      h('p', { class: 'small muted' }, '一行写一条关于你自己的事实。页面内 Claude 只在追问和整理口袋本时用它，让你前后说的一致。'),
      confirmed ? null : h('div', { class: 'notice' }, '下面是根据已知信息预填的草稿，还没生效。确认或修改后点"保存"。"老家"那条记得填上。'),
      ta,
      h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: save }, confirmed ? '保存' : '确认并保存'),
        confirmed && S.profile.updatedAt ? h('span', { class: 'small muted' }, '上次保存 ' + fmtWhen(S.profile.updatedAt)) : null));
  }

  /* ---------------- 偏好（存在本机） ---------------- */
  function select(id, value, options, onchange) {
    const s = h('select', { id, onchange: e => onchange(e.target.value) }, options.map(([v, t]) => h('option', { value: v }, t)));
    s.value = value;
    return s;
  }
  function field(label, control, hint) {
    return h('div', { class: 'stack-s' }, h('label', { class: 'small', for: control.id, style: 'font-weight:600' }, label), control, hint ? h('p', { class: 'small muted' }, hint) : null);
  }
  function renderPrefs() {
    const voices = TTS.voices;
    const hasSR = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
    const pf = Probe.flags();
    put(clear(els.prefs),
      h('h2', { class: 'section-title' }, '练习偏好'),
      h('p', { class: 'small muted' }, '这些设置只存在这台设备上。'),
      h('label', { class: 'check', for: 'pref-listen-first' },
        h('input', { type: 'checkbox', id: 'pref-listen-first', checked: !!ls.get('listenFirst', false), onchange: e => ls.set('listenFirst', e.target.checked) }),
        '先听后看：新问题先朗读，点一下才显示文字'),
      voices.length ? field('朗读语音', select('pref-voice', TTS.voice ? TTS.voice.voiceURI : '', voices.map(v => [v.voiceURI, v.name + '（' + v.lang + '）']), v => TTS.setVoice(v))) :
        h('p', { class: 'small muted' }, '这台设备没有英文朗读语音，朗读按钮已隐藏。'),
      voices.length ? field('朗读语速', select('pref-rate', String(ls.get('ttsRate', 0.95)), [['0.95', '正常'], ['0.8', '慢一点'], ['0.65', '很慢']], v => ls.set('ttsRate', Number(v)))) : null,
      field('说一次就够（页面内语音识别）', select('pref-voice-mode', Voice.mode(), [['auto', '自动：诊断第 7 项通过才显示'], ['on', '总是显示麦克风按钮'], ['off', '关闭']], v => { ls.set('voiceMode', v); ls.del('voiceBlocked'); }),
        !hasSR ? '这个浏览器没有语音识别 API（比如平板没有谷歌服务），会自动隐藏。' : '诊断结果：第 7 项 ' + (pf.asr ? (pf.asr === 'pass' ? '通过' : '失败') : '未测') + '，第 8 项 ' + (pf.asrWithRec ? (pf.asrWithRec === 'pass' ? '通过' : '失败') : '未测') + '。改动后重新打开节点生效。'),
      field('录音方式', select('pref-rec-route', ls.get('recRoute') || 'auto', [['auto', '自动'], ['page', '页面里录'], ['file', '系统录音机或选文件']], v => { if (v === 'auto') ls.del('recRoute'); else ls.set('recRoute', v); ls.del('micBlocked'); })));
  }

  /* ---------------- 数据 ---------------- */
  function renderData() {
    const status = h('p', { class: 'small muted', role: 'status' });
    const btn = h('button', { class: 'btn ghost', type: 'button', onclick: async () => {
      if (!Platform.store.available) { toast('数据库不可用'); return; }
      btn.disabled = true; status.textContent = '正在读取全部数据……';
      try {
        const data = await collectAll();
        status.textContent = '共 ' + Object.values(data.collections).reduce((a, x) => a + x.length, 0) + ' 个文档，等你确认保存……';
        const r = await Platform.blobs.saveFile('口语特训-数据-' + localDate() + '.json', JSON.stringify(data, null, 1));
        status.textContent = r && r.status === 'delivered' ? '已交出。' : '已保存。';
      } catch (e) {
        status.textContent = e.code === 'declined' ? '已取消。' : '导出失败：' + (e.code || e.message || e);
      } finally { btn.disabled = false; }
    } }, '导出全部数据（JSON）');
    put(clear(els.data),
      h('h2', { class: 'section-title' }, '数据'),
      h('p', { class: 'small muted' }, '把所有记录导出成一个 JSON 文件：既是备份，也是以后换成独立 App 时的数据来源。录音文件本身不在里面。'),
      Platform.blobs.canSave ? h('div', null, btn) : h('p', { class: 'small muted' }, '这个视图不能保存文件。'),
      status);
  }

  async function collectAll() {
    const st = Platform.store;
    const byField = { turns: 'createdAt', recordings: 'createdAt', sessions: 'startedAt', vocab: 'createdAt', probe: 'ts' };
    const plain = ['nodes', 'bank', 'personas', 'config'];
    const out = { app: '口语特训', version: APP_VERSION, exportedAt: nowIso(), artifactUrl: S.config.artifactUrl || '', collections: {} };
    for (const c of plain) out.collections[c] = await st.query(c, { limit: 1000 });
    for (const [c, f] of Object.entries(byField)) out.collections[c] = await st.queryAll(c, f);
    const me = await st.get('me/profile');
    out.collections.me = me ? [me] : [];
    return out;
  }

  /* ---------------- 关于 ---------------- */
  function renderAbout() {
    const url = S.config.artifactUrl || '';
    const code = h('code', null, url || '（未设置）');
    put(clear(els.about),
      h('h2', { class: 'section-title' }, '关于'),
      h('dl', { class: 'kv' },
        h('dt', null, '版本'), h('dd', { class: 'mono' }, APP_VERSION),
        h('dt', null, '文档数'), h('dd', null, [S.nodes.length + ' 节点', S.turns.length + ' 回答', S.recordings.length + ' 录音', S.sessions.length + ' 场次', S.vocab.length + ' 词'].join(' · ')),
        h('dt', null, '行程'), h('dd', null, S.config.tripStart ? S.config.tripStart + ' 至 ' + (S.config.tripEnd || '') : '–'),
        h('dt', null, '阈值'), h('dd', { class: 'mono' }, '停顿 ≥ ' + S.config.pauseSec + 's · 长停顿 ≥ ' + S.config.longPauseSec + 's · 低置信 < ' + S.config.lowConf + ' · 最长 ' + S.config.maxRecSec + 's')),
      url ? h('div', { class: 'copy-line' }, code, h('button', { class: 'btn small ghost', type: 'button', onclick: () => copyText(url, code) }, '复制地址')) : null,
      h('p', { class: 'small muted' }, '录音分析脚本和流程随页面发布在 tools/analyze.py 和 tools/RUNBOOK.md。'));
  }

  return { init, show, hide };
})();

/* ---- main.js ---- */
/* =====================================================================
 * 入口：底部导航、顶栏（倒计时、本次练习）、结束本次练习的小结
 * ===================================================================== */

const App = (() => {
  const TABS = [
    { id: 'practice', label: '练习', icon: 'talk' },
    { id: 'record', label: '录音', icon: 'mic' },
    { id: 'dash', label: '看板', icon: 'chart' },
    { id: 'pocket', label: '口袋本', icon: 'book' },
  ];
  const MODS = { practice: Practice, record: Record, dash: Dash, pocket: Pocket, settings: Settings };
  const tabBtns = {};
  let current = null, prev = 'practice';

  function buildTabs() {
    const bar = $('#tabs');
    for (const t of TABS) {
      const badge = h('span', { class: 'badge', hidden: true });
      const b = h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': 'false', onclick: () => go(t.id) }, icon(t.icon), h('span', null, t.label), badge);
      b._badge = badge;
      tabBtns[t.id] = b;
      put(bar, b);
    }
  }

  function go(id, anchor) {
    if (!MODS[id]) id = 'practice';
    if (current && current !== id) {
      MODS[current].hide && MODS[current].hide();
      if (current !== 'settings') prev = current;
    }
    for (const k of Object.keys(MODS)) $('#view-' + k).hidden = k !== id;
    for (const [k, b] of Object.entries(tabBtns)) b.setAttribute('aria-selected', String(k === id));
    const changed = current !== id;
    current = id;
    if (id !== 'settings') ls.set('tab', id);
    MODS[id].show(anchor);
    if (changed && id !== 'practice' && id !== 'settings') window.scrollTo(0, 0);
  }
  function back() { go(prev || 'practice'); }

  function renderCountdown() {
    const el = $('#countdown');
    const d = daysUntil(S.config.tripStart), e = daysUntil(S.config.tripEnd);
    if (d == null) el.textContent = '';
    else if (d > 0) el.textContent = '距入境申根 ' + d + ' 天';
    else if (e != null && e >= 0) el.textContent = '旅途第 ' + (1 - d) + ' 天';
    else el.textContent = '';
  }

  function renderSession() {
    const pill = $('#session-pill');
    const id = Sessions.currentId;
    if (!id) { pill.hidden = true; return; }
    pill.hidden = false;
    put(clear(pill), '本次 ', h('b', null, String(Data.sessionTurns(id).length)), ' 条 · 结束');
  }

  function renderBadge() {
    const b = tabBtns.record && tabBtns.record._badge;
    if (!b) return;
    const n = S.recordings.filter(r => r.status === 'pending').length;
    b.hidden = !n;
    b.textContent = String(n);
  }

  function endSession() {
    const id = Sessions.currentId;
    if (!id) return;
    const n = Data.sessionTurns(id).length;
    openSheet((sheet, close) => {
      const body = h('div', { class: 'stack' });
      const confirm = () => {
        put(clear(body), h('p', { class: 'status row' }, h('span', { class: 'spin', 'aria-hidden': 'true' }), ' 正在统计、生成口诀…… Thinking…'));
        Sessions.end().then(
          res => showSummary(body, res, close),
          e => put(clear(body), h('div', { class: 'notice bad' }, '没能结束：' + ((e && e.code) || e)), h('button', { class: 'btn ghost', type: 'button', onclick: close }, '关闭')));
      };
      put(sheet, h('h2', { class: 'section-title' }, '结束本次练习'), body);
      put(body,
        h('p', null, '本次练习（' + id + '）共 ' + n + ' 条回答。结束后生成小结：前三类错误、次数、例句和一句口诀。'),
        h('div', { class: 'row' },
          h('button', { class: 'btn', type: 'button', onclick: confirm }, '结束并生成小结'),
          h('button', { class: 'btn ghost', type: 'button', onclick: close }, '继续练')));
    });
  }

  function showSummary(body, res, close) {
    const s = res.summary;
    put(clear(body),
      s.top.length ? h('div', { class: 'top-errs' }, s.top.map((t, i) => h('div', { class: 'top-err' },
        h('span', { class: 'rank' }, String(i + 1)),
        h('div', null, h('span', { class: 't' }, ERROR_MAP[t.type] ? ERROR_MAP[t.type].name : t.type), h('span', { class: 'small muted' }, ' ×' + t.count)),
        h('span'),
        h('p', { class: 'ex' }, t.example_orig ? h('s', null, t.example_orig) : null, t.example_orig ? ' → ' : '', t.example_fix))))
        : h('p', null, s.nTurns ? '这次没有发现错误。' : '这次没有作答，已结束。'),
      s.rule_zh ? h('p', { class: 'notice info' }, h('b', null, '口诀：'), s.rule_zh) : null,
      arr(s.next_focus_zh).length ? h('p', null, '下次重点：' + s.next_focus_zh.join('；')) : null,
      res.llmError ? h('p', { class: 'small muted' }, '口诀没生成：' + sampleErrZh(res.llmError.code)) : null,
      h('button', { class: 'btn block', type: 'button', onclick: close }, '好'));
  }

  async function start() {
    buildTabs();
    $('#settings-btn').addEventListener('click', () => go('settings'));
    $('#session-pill').addEventListener('click', endSession);
    Practice.init($('#view-practice'));
    Record.init($('#view-record'));
    Dash.init($('#view-dash'));
    Pocket.init($('#view-pocket'));
    Settings.init($('#view-settings'));
    Bus.on('config', renderCountdown);
    Bus.on('session', renderSession);
    Bus.on('recordings', renderBadge);
    put(clear($('#view-practice')), h('p', { class: 'muted' }, '正在连接 Claude 查看器……'));
    await Platform.ready;
    Data.start();
    const hash = (location.hash || '').slice(1);
    const initial = hash === 'probe' ? 'settings' : MODS[hash] ? hash : ls.get('tab', 'practice');
    go(initial, hash === 'probe' ? 'probe' : undefined);
  }

  return { start, go, back, endSession };
})();

App.start();

</script>
