<title>口语特训</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root {
  --bg: #F1F3F7;
  --surface: #FFFFFF;
  --surface-2: #E7EBF2;
  --ink: #14203A;
  --ink-2: #4A5772;
  --ink-3: #6F7B92;
  --line: #D4DAE4;
  --accent: #1E4D8C;
  --accent-2: #DDE7F5;
  --on-accent: #FFFFFF;
  --arrow: #F0B40A;
  --arrow-ink: #3A2B00;
  --high: #B0382A;
  --high-bg: #FBE7E3;
  --low: #4A5772;
  --low-bg: #E9EDF3;
  --ok: #21704A;
  --ok-bg: #E0F1E7;
  --warn: #875800;
  --warn-bg: #FCEFD2;
  --mid-pause: #C2410C;
  --shadow: 0 1px 2px rgba(20, 32, 58, .06), 0 6px 18px rgba(20, 32, 58, .06);
  --font-ui: system-ui, -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-en: "Literata", Georgia, "Noto Serif", "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
  --r-s: 8px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0E1420;
    --surface: #161F31;
    --surface-2: #1F2A40;
    --ink: #E6EAF2;
    --ink-2: #A8B3C7;
    --ink-3: #8390A6;
    --line: #2B3751;
    --accent: #8FB3EC;
    --accent-2: #1F3150;
    --on-accent: #0E1420;
    --arrow: #F5C542;
    --arrow-ink: #2A1F00;
    --high: #F2978B;
    --high-bg: #3A201D;
    --low: #A8B3C7;
    --low-bg: #222D44;
    --ok: #76CA9C;
    --ok-bg: #173220;
    --warn: #F0C36B;
    --warn-bg: #33280F;
    --mid-pause: #FB9A5F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0E1420;
  --surface: #161F31;
  --surface-2: #1F2A40;
  --ink: #E6EAF2;
  --ink-2: #A8B3C7;
  --ink-3: #8390A6;
  --line: #2B3751;
  --accent: #8FB3EC;
  --accent-2: #1F3150;
  --on-accent: #0E1420;
  --arrow: #F5C542;
  --arrow-ink: #2A1F00;
  --high: #F2978B;
  --high-bg: #3A201D;
  --low: #A8B3C7;
  --low-bg: #222D44;
  --ok: #76CA9C;
  --ok-bg: #173220;
  --warn: #F0C36B;
  --warn-bg: #33280F;
  --mid-pause: #FB9A5F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font: 15px/1.55 var(--font-ui);
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

.en { font-family: var(--font-en); font-size: 18px; line-height: 1.5; letter-spacing: .005em; }
.en-s { font-family: var(--font-en); font-size: 17px; line-height: 1.45; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.label {
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}

/* ---------- shell ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top-in {
  max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 10px;
  display: flex; align-items: center; gap: 10px;
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
.brand h1 { font-size: 18px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.countdown { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-pill {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 4px 10px; font-size: 13px; white-space: nowrap; cursor: pointer;
}
.session-pill b { color: var(--accent); font-weight: 600; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center; flex: none;
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; cursor: pointer;
}
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink-2); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(var(--tabbar) + 28px); }
.view { display: flex; flex-direction: column; gap: 16px; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab {
  position: relative; height: var(--tabbar); border: 0; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: 12px; font-weight: 600;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); }
/* the yellow Camino arrow marks where you are */
.tab[aria-selected="true"]::before {
  content: ""; position: absolute; top: 0; left: 50%; width: 22px; height: 7px; transform: translateX(-50%);
  background: var(--arrow); clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.tab .badge {
  position: absolute; top: 8px; left: calc(50% + 8px); min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--arrow); color: var(--arrow-ink); font-size: 11px; line-height: 17px; text-align: center;
}

/* ---------- common ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.section-title { font-size: 16px; font-weight: 700; }
.section-title .muted { font-weight: 400; font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--accent); border-color: var(--line); }
.btn.quiet { background: transparent; color: var(--ink-2); border-color: transparent; padding: 0 8px; }
.btn.danger { background: var(--surface); color: var(--high); border-color: var(--line); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.link-btn { border: 0; background: none; color: var(--accent); padding: 0; cursor: pointer; font-size: 13px; font-weight: 600; }

.say-btn {
  flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--accent); display: inline-grid; place-items: center; cursor: pointer; vertical-align: middle;
}
.say-btn svg { width: 17px; height: 17px; }
.no-tts .say-btn, .no-tts .tts-only { display: none !important; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.high { background: var(--high-bg); color: var(--high); }
.chip.accent { background: var(--accent-2); color: var(--accent); }

.notice { border-radius: var(--r); padding: 12px 14px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
.notice.info { background: var(--accent-2); color: var(--ink); }
.notice.bad { background: var(--high-bg); color: var(--high); }
.notice b { font-weight: 700; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button {
  border: 0; border-radius: 8px; min-height: 36px; padding: 4px 6px; line-height: 1.25; background: transparent; color: var(--ink-2);
  font-weight: 600; cursor: pointer; font-size: 14px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

textarea, input[type="text"], select {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  padding: 10px 12px; color: var(--ink);
}
textarea { resize: vertical; min-height: 96px; }
textarea.en { font-size: 18px; }
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }

details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 16px);
  transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  box-shadow: var(--shadow);
}

.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 720px; max-height: 88%; overflow: auto;
  background: var(--bg); border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}

.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

/* ---------- practice: node list ---------- */
.track { display: flex; flex-direction: column; gap: 8px; }
.track-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.track-head h3 { font-size: 15px; }
.node-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.node-row {
  width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 10px; align-items: center;
  padding: 12px 14px; border-top: 1px solid var(--line);
}
.node-list li:first-child .node-row { border-top: 0; }
.node-row .nid { grid-row: span 2; font-family: var(--font-mono); font-weight: 600; color: var(--ink-3); font-size: 14px; }
.node-row .nt { font-weight: 600; }
.node-row .nq { grid-column: 2; color: var(--ink-2); font-family: var(--font-en); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node-row .nr { grid-row: 1 / span 2; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.node-row.is-current { background: var(--accent-2); }

/* status stamps: 已盖章 echoes the credencial stamp */
.stamp { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.stamp.todo { color: var(--ink-3); border-style: dashed; }
.stamp.doing { color: var(--accent); }
.stamp.done { color: var(--ok); transform: rotate(-4deg); }

/* ---------- practice: node page ---------- */
.node-head { display: flex; flex-direction: column; gap: 6px; }
.node-head .link-btn { align-self: flex-start; }
.node-head h2 { font-size: 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.node-head .nid { font-family: var(--font-mono); color: var(--ink-3); font-size: 15px; }
.listen { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.listen > summary { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; }
.listen > summary::after { content: "展开"; font-size: 13px; color: var(--accent); font-weight: 600; }
.listen[open] > summary::after { content: "收起"; }
.listen-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.phrase-list { display: flex; flex-direction: column; gap: 8px; }
.phrase { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.phrase .zh { grid-column: 1; color: var(--ink-2); font-size: 14px; }
.phrase .note { color: var(--ink-3); }
.phrase .say-btn { grid-row: 1 / span 2; grid-column: 2; }
.tips { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); }
.tips li { padding-left: 14px; position: relative; }
.tips li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; background: var(--arrow); clip-path: polygon(0 0, 100% 50%, 0 100%); }

.thread { display: flex; flex-direction: column; gap: 14px; }
.bubble { max-width: 92%; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: var(--accent-2); border-bottom-right-radius: 4px; }
.bubble .who { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.bubble .q-line { display: flex; gap: 10px; align-items: flex-start; }
.bubble .q-line .en { flex: 1; }
.hidden-text { filter: blur(7px); user-select: none; }
.q-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.turn { display: flex; flex-direction: column; gap: 8px; }
.fb { display: flex; flex-direction: column; gap: 10px; }
.fb-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: start; }
.fb-row .lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); padding-top: 4px; }
.fb-row.corrected .en { color: var(--ink); }
.fb-extra { font-size: 14px; color: var(--ink-2); }
.askback { font-size: 14px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 6px 10px; }
.askback .en-s { font-size: 15px; }

.errs { display: flex; flex-direction: column; gap: 6px; }
.err {
  text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--low); background: var(--surface);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
}
.err.sev-high { border-left-color: var(--high); }
.err .err-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.err .code { font-family: var(--font-mono); font-weight: 600; font-size: 12px; color: var(--ink-2); }
.err .name { font-weight: 600; }
.err .fix { font-family: var(--font-en); font-size: 16px; }
.err .fix s { color: var(--high); text-decoration-thickness: 1.5px; }
.err .note { display: block; font-size: 14px; color: var(--ink-2); }
.err .asr { font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 0 5px; }

.composer { display: flex; flex-direction: column; gap: 8px; }
.composer-row { display: flex; align-items: center; gap: 8px; }
.composer-row .status { flex: 1; font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; min-width: 0; }
.mic-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.mic-btn svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 1.8; }
.mic-btn.live { background: var(--high); border-color: var(--high); }
.mic-btn.live svg { stroke: #fff; }
.raw-reply { white-space: pre-wrap; font-family: var(--font-mono); font-size: 12px; max-height: 160px; overflow: auto; background: var(--surface-2); border-radius: 8px; padding: 8px; }

.node-foot { display: flex; gap: 8px; flex-wrap: wrap; }
.node-foot .btn { flex: 1 1 160px; }

.persona-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.persona {
  text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
}
.persona .pn { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.persona .pb { font-size: 13px; color: var(--ink-2); }
.persona .ps { font-size: 13px; color: var(--ink-3); }
.debrief-turn { display: flex; flex-direction: column; gap: 6px; }

/* ---------- record ---------- */
.rec-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 8px; }
.rec-btn {
  width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 16px;
  box-shadow: 0 0 0 6px var(--accent-2);
}
.rec-btn.live { background: var(--high); color: #fff; box-shadow: 0 0 0 6px var(--high-bg); }
.timer { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.meter { width: 100%; max-width: 320px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 4px; transition: width .08s linear; }
.file-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 20px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--ink-3); }
.banner { display: flex; flex-direction: column; gap: 8px; }
.copy-line { display: flex; gap: 8px; align-items: stretch; }
.copy-line code { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-wrap: anywhere; color: var(--ink); }

.rec-list { display: flex; flex-direction: column; gap: 8px; }
.rec-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.rec-head { width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.rec-head .rp { font-family: var(--font-en); font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-head .rm { font-size: 12px; color: var(--ink-3); }
.rec-head .chip { grid-row: 1 / span 2; grid-column: 2; }
.rec-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.rec-body audio, .rec-body video { width: 100%; max-width: 100%; }
.rec-body video { max-height: 56px; }
.transcript { font-family: var(--font-en); font-size: 18px; line-height: 1.9; }
.transcript .w.low { text-decoration: underline wavy var(--warn); text-underline-offset: 4px; cursor: pointer; }
.transcript .w.low:focus-visible { outline: 2px solid var(--accent); }
.pz { font-family: var(--font-mono); font-size: 12px; padding: 1px 4px; margin-inline: 2px; border-radius: 4px; color: var(--ink-3); background: var(--surface-2); white-space: nowrap; }
.pz.mid { color: #fff; background: var(--mid-pause); font-weight: 600; }
.lc-note { font-size: 14px; background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 8px 10px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); align-items: center; }

/* ---------- dashboard ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-size: 24px; font-weight: 700; }
.kpi .k { font-size: 12px; color: var(--ink-3); }
.top-errs { display: flex; flex-direction: column; gap: 10px; }
.top-err { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: start; }

  { code: 'WORD',    name: '用词不当或中式直译',       sev: null,   ex: ['open the light', 'turn on the light'] },

const ERROR_CODES = ERROR_TYPES.map(t => t.code);
/* asr_suspect 只用于词尾类问题 */
const ASR_SUSPECT_TYPES = ['PLUR', 'AGR', 'T-PAST', 'T-PERF'];
const MAX_SHOWN_ERRORS = 3;

const TRACKS = [
  { id: 'social',    name: '社交',   sub: '路上聊天' },
  { id: 'service',   name: '办事',   sub: '住宿、吃饭、交通' },
  { id: 'listening', name: '听力',   sub: '专项清单' },
];

const STATUS_ZH = { todo: '未开始', doing: '练习中', done: '已盖章' };

const FIXED_PROMPTS = {
  intro: { zh: '一分钟自我介绍', en: 'Introduce yourself to a fellow pilgrim.' },
};

/* 实战对话里非母语角色固定用这句 style；母语者留空 */
const NON_NATIVE_STYLE = 'Use simple words and short sentences, like a non-native speaker, but keep your grammar correct.';

/* drill 模板第 6 条里 Claude 扮演的角色：社交节点是路上的旅伴，办事节点是工作人员 */
const DRILL_ROLE = {
  social: 'a friendly fellow traveler',
  service: 'the staff member in this scenario (stay in that role)',
};

/* §8.1 任务 1–3，drill 和 debrief 共用 */
const RULES_1_TO_3 = `1. corrected: the minimal-edit correct version. Keep the learner's own words and meaning;
   fix only real errors. Ignore capitalization and punctuation.
2. errors: every error, each {type, orig, fix, sev, asr_suspect, note_zh}.
   type is one of: T-PAST, T-PERF, T-FUT, T-OTHER, BE-V, AGR, PLUR, ART, PREP, QWO, PRON,
   YESNO, WORD, STRUCT. sev is "high" if it could cause a misunderstanding, else "low".
   asr_suspect is true only for a missing or extra -s/-ed ending that speech-to-text could
   have produced. note_zh is one short Chinese sentence stating the rule.
   Casual spoken forms (gonna, yeah, dropped subjects in replies) are not errors.
3. natural: a more natural spoken version ONLY if clearly better than corrected; else null.
   Simple, friendly, everyday spoken English. Not fancy.`;

const PROMPTS = {
  /* §8.1 逐句反馈 */
  drill: `You are an English speaking coach for a Chinese native speaker preparing for a trip
(Camino de Santiago from Sarria, then Barcelona, Milan, Venice, Florence, Rome, Naples;
Oct 17 – Nov 20). The learner answered by phone speech-to-text; the text is raw.

Scenario: {{title_zh}} — main question: "{{main_q}}"
Facts the learner has confirmed about themself (keep follow-ups consistent with them):
{{profile_facts}}
Conversation so far in this scenario (oldest first, at most 6 exchanges):
{{history}}

Question asked: "{{q}}"
Learner's raw answer: "{{raw}}"

Tasks:
{{rules}}
4. asked_back: true if the answer ends by asking the other person something.
5. vocab: Chinese words the learner used because they lacked the English,
   each {zh, en, example}.
6. followup: your next line as {{role}}. React briefly to what they
   said, then ask ONE natural follow-up question (max 20 words). Draw on these if they
   fit: {{followups}}

Reply with only JSON:
{"corrected":"…","errors":[],"natural":null,"asked_back":false,"vocab":[],"followup":"…"}`,

  /* §8.2 实战对话（第一条 user 消息） */
  convo: `Role-play for speaking practice. You are {{name}}: {{bio}}. Setting: {{setting}}.
Talk the way this person would in real life: 1–3 short spoken sentences per turn,
everyday English. {{style}}
React to what the learner says and keep the conversation going; ask a question most turns.
Never correct the learner and never mention that this is practice. If you can't understand
them, ask for clarification like a real person would.
Start with a natural opening line.`,

  /* §8.3 对话讲评 */
  debrief: `Below is a role-play transcript between a learner (L) and {{name}} (P).
For EACH learner turn i, return {i, corrected, errors, natural} using these rules:
{{rules}}
Then a summary: {top:[{type,count,example_orig,example_fix}], strengths_zh, rule_zh,
next_focus_zh}. rule_zh is one short, memorable Chinese rule for the most frequent
high-severity error.
Reply with only JSON: {"turns":[…],"summary":{…}}

Transcript:
{{transcript_lines}}`,

  /* §8.4 本次练习小结：次数由页面统计 */
  summary: `A learner's most frequent spoken-English errors this session (type, count, examples):
{{top3}}
Reply with only JSON: {"rule_zh":"…","next_focus_zh":["…","…"]}
rule_zh: one short, memorable Chinese rule for the top error. next_focus_zh: at most two
concrete things to practice next time, in Chinese.`,

  /* §8.5 口袋本条目 */
  bank: `Scenario: {{title_zh}} — "{{main_q}}". Learner facts: {{profile_facts}}.
The learner's corrected answers in this scenario: {{corrected_answers}}
Write the learner's best answer to keep for the trip.
Reply with only JSON: {"best_en":"…","chunks":[{"en":"…","zh":"…"}]}
best_en: 2–4 short spoken sentences in first person, using the learner's own facts and
words where possible, ending with a question back. chunks: 4–8 reusable sentence pieces
from it, each with a Chinese gloss.`,
};

/* sample 错误码 → 给用户看的话 */
const SAMPLE_ERR_ZH = {
  cancelled: '已停止。',
  not_granted: '你没有允许这个页面使用 Claude。依赖 Claude 的功能已隐藏；重新打开页面可以再选一次。',
  sampling_disabled: '这个账号或组织不能在页面里使用 Claude。',
  not_declared: '页面没有声明 Claude 能力，需要重新发布。',
  capability_disabled: '当前环境里页面内 Claude 不可用。',
  capability_removed: '当前 App 版本不支持页面内 Claude，请更新 App 或改用浏览器。',
  unavailable: '页面内 Claude 不可用（需要在 Claude 的 artifact 查看器里打开）。',
  rate_limited: '调用太频繁或用量到上限了，稍后再试。',
  session_expired: '登录已过期，请重新登录 claude.ai。',
  refused: 'Claude 拒绝了这次请求。换个说法再试。',
  empty_completion: 'Claude 没有返回内容。',
  invalid_json: 'Claude 的回复不是有效的 JSON。',
  bad_shape: 'Claude 的回复缺少必要字段。',
  prompt_too_large: '内容太长了。',
  upstream_error: '网络或服务出错了。',
};
function sampleErrZh(code) { return SAMPLE_ERR_ZH[code] || SAMPLE_ERR_ZH.upstream_error; }

/* ---- platform.js ---- */
/* =====================================================================
 * 适配层。所有 claude.use() 调用都在这里；业务代码只用 store / blobs / llm。
 * 以后转成独立 App 时，只替换这个文件（见 spec §14）。
 * ===================================================================== */

const Platform = (() => {
  const caps = { db: null, assets: null, sample: null, downloads: null };
  const hasClaude = !!(window.claude && typeof window.claude.use === 'function');

  const ready = (async () => {
    if (!hasClaude) return caps;
    const names = Object.keys(caps);
    const got = await Promise.all(names.map(n => window.claude.use(n).catch(() => null)));
    names.forEach((n, i) => { caps[n] = got[i] || null; });
    return caps;
  })();

  function norm(e, fallback) {
    if (e && typeof e === 'object' && typeof e.code === 'string') return e;
    return { code: fallback || 'upstream_error', message: String((e && e.message) || e) };
  }
  const unavailable = what => Promise.reject({ code: 'unavailable', message: what + ' not available in this view' });

  /* 同一个文档一次只写一个 */
  const chains = new Map();
  function serial(path, fn) {
    const prev = chains.get(path) || Promise.resolve();
    const next = prev.then(fn, fn);
    const tail = next.then(() => {}, () => {});
    chains.set(path, tail);
    tail.then(() => { if (chains.get(path) === tail) chains.delete(path); });
    return next.catch(e => { throw norm(e); });
  }

  const docOut = s => (s && s.exists ? Object.assign({ id: s.id }, s.data()) : null);

  function buildQuery(coll, o) {
    let q = caps.db.collection(coll);
    for (const w of (o && o.where) || []) q = q.where(w[0], w[1], w[2]);
    if (o && o.orderBy) q = q.orderBy(o.orderBy, o.dir || 'asc');
    if (o && o.limit) q = q.limit(o.limit);
    return q;
  }

  /* ---------- store：文档数据 ---------- */
  const store = {
    get available() { return !!caps.db; },
    async get(path) {
      if (!caps.db) return unavailable('db');
      try { return docOut(await caps.db.doc(path).get()); } catch (e) { throw norm(e); }
    },
    set(path, data) { return caps.db ? serial(path, () => caps.db.doc(path).set(data)) : unavailable('db'); },
    update(path, data) { return caps.db ? serial(path, () => caps.db.doc(path).update(data)) : unavailable('db'); },
    remove(path) { return caps.db ? serial(path, () => caps.db.doc(path).delete()) : unavailable('db'); },
    async query(coll, o) {
      if (!caps.db) return unavailable('db');
      try { return (await buildQuery(coll, o).get()).docs.map(docOut); } catch (e) { throw norm(e); }
    },
    /* 按某个字段倒序分页取全部（导出用） */
    async queryAll(coll, field) {
      const out = [];
      const seen = new Set();
      let before = null;
      for (let i = 0; i < 20; i++) {
        const page = await store.query(coll, { where: before ? [[field, '<=', before]] : [], orderBy: field, dir: 'desc', limit: 1000 });
        let added = 0;
        for (const d of page) if (!seen.has(d.id)) { seen.add(d.id); out.push(d); added++; }
        if (page.length < 1000 || !added) break;
        before = page[page.length - 1][field];
      }
      if (field) {
        /* 没有这个字段的文档不会出现在排序查询里，单独补上 */
        const rest = await store.query(coll, { limit: 1000 }).catch(() => []);
        for (const d of rest) if (!seen.has(d.id)) { seen.add(d.id); out.push(d); }
      }
      return out;
    },
    watch(coll, o, next, onErr) {
      if (!caps.db) return () => {};
      return buildQuery(coll, o).onSnapshot(s => next(s.docs.map(docOut)), e => onErr && onErr(norm(e)));
    },
    watchDoc(path, next, onErr) {
      if (!caps.db) return () => {};
      return caps.db.doc(path).onSnapshot(s => next(docOut(s)), e => onErr && onErr(norm(e)));
    },
  };

  /* ---------- blobs：录音文件，以及导出文件 ---------- */
  const blobs = {
    get available() { return !!caps.assets; },
    get canSave() { return !!caps.downloads; },
    async upload(blob, type) {
      if (!caps.assets) return unavailable('assets');
      try { return await caps.assets.upload(blob, type ? { type } : undefined); } catch (e) { throw norm(e); }
    },
    url(id) { return '/_blob/' + id; },
    async fetchText(id) {
      const r = await fetch('/_blob/' + id);
      if (!r.ok) throw { code: r.status === 404 ? 'not_found' : 'upstream_error', message: 'HTTP ' + r.status };
      return r.text();
    },
    async remove(id) {
      if (!caps.assets) return unavailable('assets');
      try { return await caps.assets.delete(id); } catch (e) { throw norm(e); }
    },
    async usage() {
      if (!caps.assets) return unavailable('assets');
      try { return (await caps.assets.list()).usage; } catch (e) { throw norm(e); }
    },
    async saveFile(filename, data) {
      if (!caps.downloads) return unavailable('downloads');
      try { return await caps.downloads.save({ filename, data }); } catch (e) { throw norm(e, 'unavailable'); }
    },
  };

  /* ---------- llm：页面内 Claude ---------- */
  const PERMANENT = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
  let blocked = null;
  const blockSubs = [];
  async function call(kind, input, o) {
    if (!caps.sample) throw { code: 'unavailable', message: 'sample not available' };
    if (blocked) throw { code: blocked, message: 'blocked for this view' };
    const opts = {};
    if (o.tier) opts.modelTier = o.tier;
    if (o.signal) opts.signal = o.signal;
    if (o.onText) opts.onText = o.onText;
    if (o.cache !== undefined) opts.cache = o.cache;
    try {
      return kind === 'json' ? await caps.sample.json(input, opts) : await caps.sample(input, opts);
    } catch (e) {
      const x = norm(e);
      if (PERMANENT.includes(x.code) && !blocked) {
        blocked = x.code;
        blockSubs.forEach(f => { try { f(x.code); } catch (_) {} });
      }
      throw x;
    }
  }
  const llm = {
    get available() { return !!caps.sample && !blocked; },
    get reason() { return blocked || (caps.sample ? null : 'unavailable'); },
    json(input, o = {}) { return call('json', input, o); },
    text(input, o = {}) { return call('text', input, o); },
    onBlocked(fn) { blockSubs.push(fn); },
  };

  return { ready, hasClaude, store, blobs, llm };
})();

/* ---- util.js ---- */
/* ===================== 通用小工具 ===================== */

const $ = (sel, root = document) => root.querySelector(sel);

/* 建元素。字符串一律作为文本插入，数据库和 Claude 返回的内容不会被当成 HTML。 */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  setAttrs(el, attrs);
  appendKids(el, kids);
  return el;
}
function setAttrs(el, attrs) {
  if (!attrs) return;
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'hidden' || k === 'disabled' || k === 'checked' || k === 'value' || k === 'open') el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
}
function appendKids(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
function svgEl(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, String(v));
  appendKids(el, kids);
  return el;
}
function clear(el) { while (el && el.firstChild) el.removeChild(el.firstChild); return el; }
/* 追加子节点；和原生 append 不同，null/false 会被跳过，数组会被展开 */
function put(el, ...kids) { appendKids(el, kids); return el; }

const ICON_PATHS = {
  talk: 'M4 5h16v10H9l-5 4z',
  mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  book: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11',
};
function icon(name) {
  return svgEl('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true' }, svgEl('path', { d: ICON_PATHS[name] }));
}

/* localStorage：读写都包 try/catch，失败时页面照常工作 */
const ls = {
  get(key, dflt = null) {
    try { const v = localStorage.getItem('kx:' + key); return v == null ? dflt : JSON.parse(v); } catch (_) { return dflt; }
  },
  set(key, val) { try { localStorage.setItem('kx:' + key, JSON.stringify(val)); } catch (_) {} },
  del(key) { try { localStorage.removeItem('kx:' + key); } catch (_) {} },
};

function fill(tpl, vars) {
  return tpl.replace(/\{\{(\w+)\}\}/g, (m, k) => (Object.prototype.hasOwnProperty.call(vars, k) ? String(vars[k]) : m));
}
function uid(prefix) {
  return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}

/* ---------- 朗读：speechSynthesis 的英文语音；没有就隐藏朗读按钮 ---------- */
const TTS = (() => {
  let voices = [], voice = null, checked = false;
  const subs = [];
  const synth = window.speechSynthesis;
  function load() {
    if (!synth) return;
    const all = synth.getVoices() || [];
    voices = all.filter(v => /^en([-_]|$)/i.test(v.lang));
    const want = ls.get('ttsVoice');
    voice = voices.find(v => v.voiceURI === want) || voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /en[-_]GB/i.test(v.lang)) || voices[0] || null;
    if (voices.length) { checked = true; notify(); }
  }
  function notify() {
    document.documentElement.classList.toggle('no-tts', !voice);
    subs.forEach(f => f());
  }
  if (synth) {
    load();
    try { synth.addEventListener('voiceschanged', load); } catch (_) { synth.onvoiceschanged = load; }
    setTimeout(() => { if (!checked) { load(); checked = true; notify(); } }, 3000);
  } else {
    checked = true;
  }
  document.documentElement.classList.toggle('no-tts', !voice);
  return {
    get available() { return !!voice; },
    get voices() { return voices; },
    get voice() { return voice; },
    setVoice(uri) { ls.set('ttsVoice', uri); load(); notify(); },
    speak(text, rate) {
      if (!voice || !text) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voice; u.lang = voice.lang;
      u.rate = rate || ls.get('ttsRate', 0.95);
      synth.speak(u);
    },
    onChange(f) { subs.push(f); },
  };
})();

/* ===================== 音频工具：解码、粗测停顿、上传类型 ===================== */

const AudioTools = (() => {
  const REC_TYPES = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
  const MAX_WRAP_BYTES = 15 * 1024 * 1024;

  async function decode(blob) {
    const buf = await blob.arrayBuffer();
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!Ctx) throw new Error('no OfflineAudioContext');
    const ctx = new Ctx(1, 16000, 16000);
    const ab = await new Promise((res, rej) => {
      const p = ctx.decodeAudioData(buf, res, rej);
      if (p && typeof p.then === 'function') p.then(res, rej);
    });
    const ch = ab.numberOfChannels, len = ab.length;
    const mono = new Float32Array(len);
    for (let c = 0; c < ch; c++) {
      const d = ab.getChannelData(c);
      for (let i = 0; i < len; i++) mono[i] += d[i] / ch;
    }
    return { samples: mono, sr: ab.sampleRate, duration: ab.duration };
  }

  function frameDb(samples, sr, frameS = 0.02) {
    const f = Math.max(1, Math.round(sr * frameS));
    const n = Math.floor(samples.length / f);
    const db = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      for (let j = i * f, e = j + f; j < e; j++) s += samples[j] * samples[j];
      db[i] = 20 * Math.log10(Math.sqrt(s / f) + 1e-9);
    }
    return db;
  }
  function pct(a, p) {
    if (!a.length) return -180;
    const s = Float32Array.from(a).sort();
    const i = Math.min(s.length - 1, Math.max(0, Math.round((p / 100) * (s.length - 1))));
    return s[i];
  }
  const r2 = x => Math.round(x * 100) / 100;

  function level(samples, sr) {
    const db = frameDb(samples, sr);
    const peak = pct(db, 95), floor = pct(db, 10);
    return { peakDb: Math.round(peak), floorDb: Math.round(floor), rangeDb: Math.round(peak - floor) };
  }

  /* §9 本地粗测：20 ms 帧，第 10 百分位作底噪，高 12 dB 算说话，3 帧多数表决，
     首尾说话之间连续静音 ≥ pauseSec 算一次停顿。仅作即时反馈。 */
  function roughPauses(samples, sr, pauseSec) {
    const frameS = 0.02;
    const db = frameDb(samples, sr, frameS);
    const n = db.length;
    if (n < 10) return null;
    const floor = pct(db, 10), loud = pct(db, 95);
    const raw = new Uint8Array(n);
    for (let i = 0; i < n; i++) raw[i] = db[i] > floor + 12 ? 1 : 0;
    const sp = new Uint8Array(n);
    for (let i = 0; i < n; i++) sp[i] = ((i > 0 ? raw[i - 1] : 0) + raw[i] + (i < n - 1 ? raw[i + 1] : 0)) >= 2 ? 1 : 0;
    const first = sp.indexOf(1), last = sp.lastIndexOf(1);
    const noisy = loud - floor < 15;
    if (first < 0) return { pauses: 0, longestPauseSec: 0, speakingRatio: 0, noisy };
    let pauses = 0, longest = 0, run = 0, speech = 0;
    for (let i = first; i <= last; i++) {
      if (sp[i]) {
        if (run * frameS >= pauseSec) { pauses++; longest = Math.max(longest, run * frameS); }
        run = 0; speech++;
      } else run++;
    }
    return { pauses, longestPauseSec: r2(longest), speakingRatio: r2(speech / (last - first + 1)), noisy };
  }

  /* 录制 mimeType / 文件 → 上传类型。其他格式用 base64 包成 text/plain。 */
  function uploadTypeFor(mime, name) {
    const m = (mime || '').toLowerCase();
    const ext = ((name || '').split('.').pop() || '').toLowerCase();
    if (m.startsWith('audio/webm') || m.startsWith('video/webm') || ext === 'webm') return { type: 'video/webm', wrap: false };
    if (m.startsWith('audio/mp4') || m.startsWith('video/mp4') || m === 'audio/x-m4a' || m === 'audio/m4a' || ext === 'm4a' || ext === 'mp4') return { type: 'video/mp4', wrap: false };
    return { type: 'text/plain', wrap: true };
  }
  function guessMime(name) {
    const ext = ((name || '').split('.').pop() || '').toLowerCase();
    return ({ m4a: 'audio/mp4', mp4: 'audio/mp4', webm: 'audio/webm', mp3: 'audio/mpeg', aac: 'audio/aac', amr: 'audio/amr', ogg: 'audio/ogg', opus: 'audio/ogg', wav: 'audio/wav', '3gp': 'audio/3gpp', flac: 'audio/flac' })[ext] || '';
  }

  function toBase64(blob) {
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result).split(',')[1] || '');
      fr.onerror = () => rej(fr.error);
      fr.readAsDataURL(blob);
    });
  }
  function base64ToBlob(b64, type) {
    const bin = atob(b64.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: type || 'application/octet-stream' });
  }

  function pickRecorderMime() {
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
    return REC_TYPES.find(t => MediaRecorder.isTypeSupported(t)) || '';
  }

  /* 上传一段录音：按类型直传，unsupported_type 时改用 base64，store_unavailable 重试一次 */
  async function uploadRecording(blob, mime, name) {
    const plan = uploadTypeFor(mime, name);
    const wrapped = async () => {
      if (blob.size > MAX_WRAP_BYTES) throw { code: 'too_large', message: '原始文件超过 15 MB' };
      const b64 = await toBase64(blob);
      return { res: await withRetry(() => Platform.blobs.upload(new Blob([b64], { type: 'text/plain' }), 'text/plain')), uploadType: 'text/plain' };
    };
    if (plan.wrap) return wrapped();
    try {
      return { res: await withRetry(() => Platform.blobs.upload(blob, plan.type)), uploadType: plan.type };
    } catch (e) {
      if (e.code === 'unsupported_type') return wrapped();
      throw e;
    }
  }
  async function withRetry(fn) {
    try { return await fn(); } catch (e) {
      if (e.code !== 'store_unavailable') throw e;
      await sleep(1500);
      return fn();
    }
  }

  return { decode, level, roughPauses, uploadTypeFor, guessMime, toBase64, base64ToBlob, pickRecorderMime, uploadRecording, REC_TYPES, MAX_WRAP_BYTES };
})();

/* =====================================================================

const Probe = (() => {
  const MR_TYPES = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  const ITEMS = [
    { n: 1, key: 'gum',        title: '页面里获取麦克风', sub: 'getUserMedia' },
    { n: 2, key: 'recorder',   title: '页面里录 5 秒',     sub: 'MediaRecorder 格式与录音' },
    { n: 3, key: 'upload',     title: '上传页面录音',       sub: 'assets.upload，video/webm 或 video/mp4' },
    { n: 4, key: 'filePick',   title: '系统录音机或选文件', sub: '再以 base64 text/plain 上传', manual: true },
    { n: 5, key: 'sample',     title: '页面内 Claude',      sub: 'sample.json，quick 档' },
    { n: 6, key: 'tts',        title: '英文朗读语音',       sub: 'speechSynthesis.getVoices()' },
    { n: 7, key: 'asr',        title: '网页语音识别',       sub: 'webkitSpeechRecognition', manual: true },
    { n: 8, key: 'asrWithRec', title: '识别和录音同时进行', sub: 'MediaRecorder + 语音识别', manual: true },
    { n: 9, key: 'saved',      title: '写入数据库',         sub: 'probe/{ts}' },
  ];
  const STATUS = { pass: ['通过', 'ok'], fail: ['失败', 'high'], skip: ['跳过', ''], running: ['进行中', 'accent'], idle: ['未测', ''] };

  let R = null, docId = null, root = null, stream = null, recBlob = null, busy = false;
  let saveChain = Promise.resolve();

  const SR = () => window.SpeechRecognition || window.webkitSpeechRecognition || null;

  function micPolicy() {
    try {
      const fp = document.permissionsPolicy || document.featurePolicy;
      return fp && fp.allowsFeature ? fp.allowsFeature('microphone') : null;
    } catch (_) { return null; }
  }
  function isFramed() { try { return window.top !== window.self; } catch (_) { return true; } }
  function device() {
    const ua = navigator.userAgent;
    const app = /Claude/i.test(ua) ? 'Claude App' : /wv\)/.test(ua) ? 'WebView' : /Chrome\//.test(ua) ? 'Chrome' : 'Browser';
    const kind = /Mobile/.test(ua) ? '手机' : /Android/.test(ua) ? '平板' : '电脑';
    return kind + ' · ' + app;
  }

  function fresh() {
    const ts = nowIso();
    docId = ts;
    R = {
      ts, ua: navigator.userAgent, device: device(), appVersion: APP_VERSION, startedAt: ts, updatedAt: ts,
      context: {
        hasClaude: Platform.hasClaude, db: Platform.store.available, assets: Platform.blobs.available,
        sample: Platform.llm.available, downloads: Platform.blobs.canSave,
        framed: isFramed(), secureContext: window.isSecureContext, micPolicy: micPolicy(),
        mediaDevices: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
        mediaRecorder: typeof MediaRecorder !== 'undefined', speechRecognition: !!SR(),
        speechSynthesis: !!window.speechSynthesis,
        standalone: !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches),
      },
      items: {},
    };
  }

  function set(key, val, save = true) {
    R.items[key] = val;
    renderItem(key);
    renderVerdict();
    if (save && val.status !== 'running') scheduleSave();
  }

  function scheduleSave() {
    saveChain = saveChain.then(async () => {
      const items = Object.assign({}, R.items); delete items.saved;
      R.updatedAt = nowIso();
      const doc = JSON.parse(JSON.stringify(Object.assign({}, R, { items })));
      remember(items);
      if (!Platform.store.available) { R.items.saved = { status: 'fail', message: '数据库不可用：需要在 Claude 的 artifact 查看器里打开' }; }
      else {
        try { await Platform.store.set('probe/' + docId, doc); R.items.saved = { status: 'pass', path: 'probe/' + docId }; }
        catch (e) { R.items.saved = { status: 'fail', code: e.code, message: e.message }; }
      }
      renderItem('saved');
    });
  }

  /* 本机结论存在 localStorage，页面据此选择录音方式和"说一次就够" */
  function remember(items) {
    const prev = ls.get('probe', {}) || {};
    const out = Object.assign({}, prev, { ts: R.ts, ua: R.ua });
    for (const k of ['gum', 'recorder', 'upload', 'filePick', 'sample', 'asr', 'asrWithRec']) {
      if (items[k] && (items[k].status === 'pass' || items[k].status === 'fail')) out[k] = items[k].status;
    }
    ls.set('probe', out);
  }
  function flags() { return ls.get('probe', {}) || {}; }

  /* ---------------- 各项测试 ---------------- */
  async function getStream() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'NoAPI', message: 'navigator.mediaDevices.getUserMedia 不存在' };
    return navigator.mediaDevices.getUserMedia({ audio: true });
  }
  function stopStream(s) { try { s && s.getTracks().forEach(t => t.stop()); } catch (_) {} }

  async function runGum() {
    set('gum', { status: 'running' }, false);
    try {
      stream = await getStream();
      const t = stream.getAudioTracks()[0];
      const st = t && t.getSettings ? t.getSettings() : {};
      set('gum', { status: 'pass', label: t ? t.label : '', sampleRate: st.sampleRate || null, channelCount: st.channelCount || null, echoCancellation: st.echoCancellation ?? null, noiseSuppression: st.noiseSuppression ?? null });
    } catch (e) {
      stream = null;
      set('gum', { status: 'fail', error: e.name || 'Error', message: e.message || String(e) });
    }
  }

  async function recordFor(s, sec, onTick) {
    const mime = AudioTools.pickRecorderMime();
    const rec = new MediaRecorder(s, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : { audioBitsPerSecond: 64000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(res => { rec.onstop = res; });
    rec.start(1000);
    for (let i = sec; i > 0; i--) { onTick && onTick(i); await sleep(1000); }
    rec.stop();
    await stopped;
    return new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
  }

  async function levelOf(blob) {
    try { const a = await AudioTools.decode(blob); return Object.assign({ duration: Math.round(a.duration * 10) / 10 }, AudioTools.level(a.samples, a.sr)); }
    catch (_) { return null; }
  }

  async function runRecorder() {
    const supported = {};
    const hasMR = typeof MediaRecorder !== 'undefined';
    for (const t of MR_TYPES) supported[t] = !!(hasMR && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    if (!hasMR) return set('recorder', { status: 'fail', supported, error: 'NoMediaRecorder' });
    if (!stream) return set('recorder', { status: 'skip', supported, message: '第 1 项没通过，无法在页面里录音' });
    try {
      recBlob = await recordFor(stream, 5, i => set('recorder', { status: 'running', message: '请说几句英文……还剩 ' + i + ' 秒' }, false));
      const lv = await levelOf(recBlob);
      set('recorder', {
        status: recBlob.size > 0 ? 'pass' : 'fail', supported, mimeType: recBlob.type, sizeBytes: recBlob.size,
        durationSec: lv ? lv.duration : null, peakDb: lv ? lv.peakDb : null, rangeDb: lv ? lv.rangeDb : null, decodable: !!lv,
      });
    } catch (e) {
      recBlob = null;
      set('recorder', { status: 'fail', supported, error: e.name || e.code || 'Error', message: e.message || String(e) });
    }
  }

  async function runUpload() {
    if (!recBlob) return set('upload', { status: 'skip', message: '没有第 2 项的录音' });
    if (!Platform.blobs.available) return set('upload', { status: 'fail', code: 'unavailable', message: 'assets 不可用' });
    const type = /mp4/i.test(recBlob.type) ? 'video/mp4' : 'video/webm';
    set('upload', { status: 'running', message: '上传中……' }, false);
    try {
      const r = await Platform.blobs.upload(recBlob, type);
      set('upload', { status: 'pass', type, id: r.id, sizeBytes: r.sizeBytes, contentType: r.contentType });
    } catch (e) {
      set('upload', { status: 'fail', type, code: e.code, message: e.message });
    }
  }

  async function onFile(file, viaCapture) {
    if (!file) return;
    set('filePick', { status: 'running', message: '读取和上传中……' }, false);
    const info = { viaCapture, name: file.name, type: file.type || '', sizeBytes: file.size };
    const lv = await levelOf(file);
    info.decodable = !!lv;
    info.durationSec = lv ? lv.duration : null;
    if (!Platform.blobs.available) return set('filePick', Object.assign(info, { status: 'fail', code: 'unavailable', message: 'assets 不可用' }));
    if (file.size > AudioTools.MAX_WRAP_BYTES) return set('filePick', Object.assign(info, { status: 'fail', code: 'too_large', message: '超过 15 MB' }));
    try {
      const b64 = await AudioTools.toBase64(file);
      const r = await Platform.blobs.upload(new Blob([b64], { type: 'text/plain' }), 'text/plain');
      info.uploadId = r.id; info.uploadType = 'text/plain'; info.uploadedBytes = r.sizeBytes;
    } catch (e) { info.code = e.code; info.message = e.message; }
    const plan = AudioTools.uploadTypeFor(file.type || AudioTools.guessMime(file.name), file.name);
    if (!plan.wrap) {
      try { const r2 = await Platform.blobs.upload(file, plan.type); info.directId = r2.id; info.directType = plan.type; }
      catch (e) { info.directType = plan.type; info.directCode = e.code; }
    }
    set('filePick', Object.assign(info, { status: info.uploadId ? 'pass' : 'fail' }));
  }

  async function runSample() {
    if (!Platform.llm.available) return set('sample', { status: 'fail', code: Platform.llm.reason || 'unavailable' });
    set('sample', { status: 'running', message: '等待 Claude……第一次会弹出同意框' }, false);
    const t0 = performance.now();
    try {
      const r = await Platform.llm.json('Reply with only {"ok": true}', { tier: 'quick' });
      set('sample', { status: r && r.ok === true ? 'pass' : 'fail', reply: JSON.stringify(r).slice(0, 200), ms: Math.round(performance.now() - t0) });
    } catch (e) {
      set('sample', { status: 'fail', code: e.code, message: e.message });
    }
  }

  async function runTts() {
    if (!window.speechSynthesis) return set('tts', { status: 'fail', message: '没有 speechSynthesis' });
    let vs = speechSynthesis.getVoices() || [];
    for (let i = 0; i < 10 && !vs.length; i++) { await sleep(300); vs = speechSynthesis.getVoices() || []; }
    const en = vs.filter(v => /^en([-_]|$)/i.test(v.lang));
    set('tts', { status: en.length ? 'pass' : 'fail', total: vs.length, english: en.slice(0, 12).map(v => v.name + ' (' + v.lang + (v.localService ? '，本地' : '') + ')') });
  }

  function recognizeOnce(maxMs) {
    return new Promise(resolve => {
      const Rec = SR();
      const rec = new Rec();
      rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
      let text = '', error = null, started = false, done = false, t = null;
      const finish = () => { if (done) return; done = true; clearTimeout(t); resolve({ text: text.trim(), error, started }); };
      rec.onstart = () => { started = true; };
      rec.onresult = e => { text = Array.from(e.results).map(x => x[0].transcript).join(' '); };
      rec.onerror = e => { error = e.error || 'error'; };
      rec.onend = finish;
      t = setTimeout(() => { try { rec.stop(); } catch (_) {} setTimeout(finish, 1500); }, maxMs);
      try { rec.start(); } catch (e) { error = e.name || 'start_failed'; finish(); }
    });
  }

  async function runAsr() {
    if (!SR()) return set('asr', { status: 'fail', exists: false, message: '这个浏览器没有语音识别 API' });
    set('asr', { status: 'running', message: '请说一句英文，比如 "Where are you from?"' }, false);
    const t0 = performance.now();
    const r = await recognizeOnce(10000);
    set('asr', { status: r.text ? 'pass' : 'fail', exists: true, text: r.text, error: r.error, started: r.started, ms: Math.round(performance.now() - t0) });
  }

  async function runAsrWithRec() {
    if (!SR()) return set('asrWithRec', { status: 'fail', message: '没有语音识别 API' });
    if (typeof MediaRecorder === 'undefined') return set('asrWithRec', { status: 'fail', message: '没有 MediaRecorder' });
    set('asrWithRec', { status: 'running', message: '请说一句英文（边识别边录音）' }, false);
    let s = null;
    try { s = await getStream(); } catch (e) { return set('asrWithRec', { status: 'fail', error: e.name, message: '拿不到麦克风：' + (e.message || e.name) }); }
    try {
      const mime = AudioTools.pickRecorderMime();
      const rec = new MediaRecorder(s, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : {});
      const chunks = [];
      rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise(res => { rec.onstop = res; });
      rec.start(1000);
      const r = await recognizeOnce(10000);
      rec.stop(); await stopped;
      const blob = new Blob(chunks, { type: rec.mimeType || mime });
      const lv = await levelOf(blob);
      const hasAudio = !!(lv && lv.peakDb > -50 && lv.rangeDb >= 10);
      set('asrWithRec', { status: r.text && hasAudio ? 'pass' : 'fail', text: r.text, error: r.error, recSizeBytes: blob.size, peakDb: lv ? lv.peakDb : null, rangeDb: lv ? lv.rangeDb : null, hasAudio });
    } catch (e) {
      set('asrWithRec', { status: 'fail', error: e.name || 'Error', message: e.message || String(e) });
    } finally { stopStream(s); }
  }

  async function runAuto() {
    if (busy) return;
    busy = true; renderButtons();
    try {
      await runGum();
      await runRecorder();
      await runUpload();
      stopStream(stream); stream = null;
      await runSample();
      await runTts();
    } finally { busy = false; renderButtons(); }
  }

  /* ---------------- 决策表（spec §11） ---------------- */
  function verdict(it) {
    const ok = k => it[k] && it[k].status === 'pass';
    const bad = k => it[k] && (it[k].status === 'fail' || it[k].status === 'skip');
    const out = [];
    if (ok('gum') && ok('recorder') && ok('upload')) out.push(['主方案', '在页面里录音']);
    else if (bad('gum') && ok('filePick')) out.push(['备选 A', '用系统录音机录，页面负责上传。不用去对话里转发文件']);
    else if (bad('gum') && bad('filePick')) out.push(['备选 B', '录音走对话附件；页面只做文字练习和看板']);
    else if (bad('gum')) out.push(['待定', '页面里不能录音。请测第 4 项，看能不能用系统录音机']);
    if (bad('sample')) out.push(['注意', '页面内 Claude 不可用：文字练习回到 Claude 对话里做']);
    if (ok('asr') && ok('asrWithRec')) out.push(['说一次就够', '在这台设备上启用']);
    else if (ok('asr') && bad('asrWithRec')) out.push(['语音识别', '可用，但不能和录音同时用：分成两个按钮']);
    else if (bad('asr')) out.push(['语音识别', '不可用，继续用输入法的语音输入']);
    return out;
  }

  /* ---------------- 渲染 ---------------- */
  const els = {};
  function detailText(key, v) {
    if (!v) return '';
    if (v.message && v.status === 'running') return v.message;
    const parts = [];
    const add = (k, x) => { if (x !== undefined && x !== null && x !== '') parts.push(k + '：' + x); };
    switch (key) {
      case 'gum': add('错误', v.error); add('说明', v.message); add('设备', v.label); break;
      case 'recorder':
        if (v.supported) parts.push(Object.entries(v.supported).map(([t, b]) => (b ? '✓ ' : '✗ ') + t).join('  '));
        add('录到', v.mimeType); add('大小', v.sizeBytes != null ? fmtBytes(v.sizeBytes) : null); add('时长', v.durationSec != null ? v.durationSec + ' 秒' : null);
        add('音量', v.peakDb != null ? v.peakDb + ' dB，动态范围 ' + v.rangeDb + ' dB' : null); add('错误', v.error); add('说明', v.message); break;
      case 'upload': add('类型', v.type); add('资产 id', v.id); add('大小', v.sizeBytes != null ? fmtBytes(v.sizeBytes) : null); add('错误码', v.code); add('说明', v.message); break;
      case 'filePick':
        add('文件', v.name); add('类型', v.type || '（空）'); add('大小', v.sizeBytes != null ? fmtBytes(v.sizeBytes) : null);
        add('可解码', v.decodable === undefined ? null : v.decodable ? '是' : '否'); add('时长', v.durationSec != null ? v.durationSec + ' 秒' : null);
        add('base64 上传 id', v.uploadId); add('直传 ' + (v.directType || ''), v.directId || v.directCode); add('错误码', v.code); add('说明', v.message); break;
      case 'sample': add('回复', v.reply); add('耗时', v.ms != null ? v.ms + ' ms' : null); add('错误码', v.code); add('说明', v.message); break;
      case 'tts': add('语音总数', v.total); add('英文', v.english && v.english.length ? v.english.join('；') : v.status === 'fail' ? '没有' : null); add('说明', v.message); break;
      case 'asr': add('识别到', v.text || (v.status === 'fail' ? '（没有文字）' : null)); add('错误码', v.error); add('说明', v.message); break;
      case 'asrWithRec': add('识别到', v.text || (v.status === 'fail' ? '（没有文字）' : null)); add('录音有声音', v.hasAudio === undefined ? null : v.hasAudio ? '是' : '否'); add('音量', v.peakDb != null ? v.peakDb + ' dB' : null); add('错误码', v.error); add('说明', v.message); break;
      case 'saved': add('位置', v.path); add('错误码', v.code); add('说明', v.message); break;
    }
    return parts.join(' · ');
  }

  function renderItem(key) {
    const row = els['row-' + key];
    if (!row) return;
    const v = (R && R.items[key]) || { status: 'idle' };
    const [label, cls] = STATUS[v.status] || STATUS.idle;
    const chip = row.querySelector('.chip');
    chip.className = 'chip ' + cls;
    put(clear(chip), v.status === 'running' ? h('span', { class: 'spin', 'aria-hidden': 'true' }) : '', label);
    row.querySelector('.pi-d').textContent = detailText(key, v);
  }

  function renderVerdict() {
    const box = els.verdict;
    if (!box) return;
    const lines = verdict((R && R.items) || {});
    clear(box);
    if (!lines.length) { box.hidden = true; return; }
    box.hidden = false;
    put(box, h('p', { class: 'label' }, '结论（按 spec 决策表）'), ...lines.map(([k, v]) => h('p', null, h('b', null, k + '：'), v)));
  }

  function renderButtons() {
    if (els.auto) { els.auto.disabled = busy; els.auto.textContent = busy ? '检测中……' : '运行自动项（1 2 3 5 6）'; }
  }

  function mount(el) {
    root = el;
    fresh();
    const fileCap = h('input', { type: 'file', accept: 'audio/*', capture: '', id: 'probe-file-cap', hidden: true, onchange: e => onFile(e.target.files[0], true) });
    const filePick = h('input', { type: 'file', accept: 'audio/*,video/webm,video/mp4,.m4a,.amr,.aac,.3gp,.mp3,.wav,.ogg', id: 'probe-file-pick', hidden: true, onchange: e => onFile(e.target.files[0], false) });
    const actions = {
      filePick: [h('button', { class: 'btn small ghost', type: 'button', onclick: () => fileCap.click() }, '用系统录音机录'), h('button', { class: 'btn small ghost', type: 'button', onclick: () => filePick.click() }, '选择录音文件')],
      tts: [h('button', { class: 'btn small ghost', type: 'button', onclick: () => TTS.speak("Buen Camino! How's it going?") }, '试听')],
      asr: [h('button', { class: 'btn small ghost', type: 'button', onclick: () => runAsr() }, '开始（说一句英文）')],
      asrWithRec: [h('button', { class: 'btn small ghost', type: 'button', onclick: () => runAsrWithRec() }, '开始（说一句英文）')],
    };
    const list = h('div', { class: 'probe-list' }, ITEMS.map(it => {
      const row = h('div', { class: 'probe-item' },
        h('span', { class: 'pi-n' }, String(it.n)),
        h('div', null, h('div', { class: 'pi-t' }, it.title), h('div', { class: 'small muted' }, it.sub)),
        h('span', { class: 'chip' }, '未测'),
        h('div', { class: 'pi-d' }),
        actions[it.key] ? h('div', { class: 'pi-a' }, actions[it.key]) : null);
      els['row-' + it.key] = row;
      return row;
    }));
    els.auto = h('button', { class: 'btn', type: 'button', onclick: runAuto }, '运行自动项（1 2 3 5 6）');
    els.verdict = h('div', { class: 'notice info stack-s', hidden: true });
    const ctx = R.context;
    const ctxLine = h('p', { class: 'small muted' },
      R.device + ' · 数据库 ' + (ctx.db ? '✓' : '✗') + ' · 资产 ' + (ctx.assets ? '✓' : '✗') + ' · Claude ' + (ctx.sample ? '✓' : '✗') + ' · 下载 ' + (ctx.downloads ? '✓' : '✗') +
      ' · 麦克风策略 ' + (ctx.micPolicy === null ? '未知' : ctx.micPolicy ? '允许' : '禁止'));
    put(clear(root), 
      h('div', { class: 'stack' },
        h('p', { class: 'small' }, '先点"运行自动项"，第 2 项会录 5 秒，请对着手机说几句英文。第 4、7、8 项需要你手动点。结果自动保存，不用转述给 Claude。'),
        ctxLine,
        h('div', { class: 'row' }, els.auto, h('button', { class: 'btn ghost', type: 'button', onclick: () => { fresh(); ITEMS.forEach(i => renderItem(i.key)); renderVerdict(); toast('已开始新的一轮检测'); } }, '重新开始')),
        list, fileCap, filePick, els.verdict));
    ITEMS.forEach(i => renderItem(i.key));
  }

  return { mount, flags, verdict };
})();

/* ---- data.js ---- */
/* =====================================================================
 * 数据：订阅 db，维护内存里的状态 S。统计一律由 turns 和 recordings 实时算出。
 * ===================================================================== */

const DEFAULT_CONFIG = { pauseSec: 0.5, longPauseSec: 1.0, lowConf: 0.6, maxRecSec: 180, artifactUrl: '' };

const S = {
  nodes: [], nodeMap: {},
  turns: [],          // 按时间正序
  recordings: [],     // 按时间倒序
  sessions: [],       // 按开始时间倒序
  bank: {}, vocab: [], personas: [],
  profile: null, profileDraft: null,
  config: Object.assign({}, DEFAULT_CONFIG),
  loaded: {},
  dbError: null,
};

const Data = (() => {
  const TRACK_ORDER = { social: 0, service: 1, listening: 2 };
  function sortNodes(list) {
    return list.slice().sort((a, b) => (TRACK_ORDER[a.track] ?? 9) - (TRACK_ORDER[b.track] ?? 9) || (a.order || 0) - (b.order || 0) || String(a.id).localeCompare(String(b.id)));
  }
  function onErr(what) {
    return e => {
      S.dbError = e;
      console.warn('db ' + what, e);
      Bus.emit('dbError', e);
    };
  }
  function loaded(key) { S.loaded[key] = true; Bus.emit(key); Bus.emit('any', key); }

  function start() {
    const st = Platform.store;
    if (!st.available) return;
    st.watch('nodes', { limit: 300 }, docs => { S.nodes = sortNodes(docs); S.nodeMap = Object.fromEntries(S.nodes.map(n => [n.id, n])); loaded('nodes'); }, onErr('nodes'));
    st.watch('turns', { orderBy: 'createdAt', dir: 'desc', limit: 1000 }, docs => { S.turns = docs.slice().reverse(); loaded('turns'); }, onErr('turns'));
    st.watch('recordings', { orderBy: 'createdAt', dir: 'desc', limit: 500 }, docs => { S.recordings = docs; loaded('recordings'); }, onErr('recordings'));
    st.watch('sessions', { orderBy: 'startedAt', dir: 'desc', limit: 300 }, docs => { S.sessions = docs; loaded('sessions'); }, onErr('sessions'));
    st.watch('bank', { limit: 300 }, docs => { S.bank = Object.fromEntries(docs.map(d => [d.id, d])); loaded('bank'); }, onErr('bank'));
    st.watch('vocab', { orderBy: 'createdAt', dir: 'desc', limit: 1000 }, docs => { S.vocab = docs; loaded('vocab'); }, onErr('vocab'));
    st.watch('personas', { limit: 100 }, docs => { S.personas = docs.slice().sort((a, b) => (a.order || 0) - (b.order || 0)); loaded('personas'); }, onErr('personas'));
    st.watchDoc('me/profile', d => { S.profile = d; loaded('profile'); }, onErr('profile'));
    st.watchDoc('config/app', d => { S.config = Object.assign({}, DEFAULT_CONFIG, d || {}); loaded('config'); }, onErr('config'));
    st.watchDoc('config/profileDraft', d => { S.profileDraft = d; loaded('profileDraft'); }, onErr('profileDraft'));
  }

  /* ---------- 派生数据 ---------- */
  const profileFacts = () => arr(S.profile && S.profile.facts).map(str).filter(Boolean);
  const turnsOfNode = id => S.turns.filter(t => t.nodeId === id);

  /* 所有带错误的"作答"：文字作答 + 已分析录音 */
  function answerUnits() {
    const out = S.turns.map(t => ({ at: t.createdAt, words: t.n_words || countWords(t.raw), errors: arr(t.errors), kind: 'turn' }));
    for (const r of S.recordings) {
      if (r.status === 'analyzed' && r.analysis) out.push({ at: r.analyzedAt || r.createdAt, words: r.analysis.n_words || 0, errors: arr(r.analysis.errors), kind: 'rec' });
    }
    return out;
  }

  /* 按类型计数，按次数、再按 high 次数排序；每类带最近一条例句 */
  function tallyErrors(errors) {
    const m = {};
    for (const e of errors) {
      const code = ERROR_MAP[e.type] ? e.type : 'STRUCT';
      const x = m[code] || (m[code] = { type: code, count: 0, high: 0, example_orig: '', example_fix: '', note_zh: '' });
      x.count++;
      if (e.sev === 'high') x.high++;
      if (e.orig || e.fix) { x.example_orig = str(e.orig); x.example_fix = str(e.fix); x.note_zh = str(e.note_zh) || x.note_zh; }
    }
    return Object.values(m).sort((a, b) => b.count - a.count || b.high - a.high);
  }

  const sessionTurns = id => S.turns.filter(t => t.sessionId === id);

  return { start, sortNodes, profileFacts, turnsOfNode, answerUnits, tallyErrors, sessionTurns };
})();

/* =====================================================================
 * 练习场次：用户开始作答时创建，点"结束本次练习"时关闭。id = 日期-序号。
 * ===================================================================== */
const Sessions = (() => {
  let currentId = null;
  let creating = null;

  function openSession() { return S.sessions.find(s => !s.endedAt) || null; }
  function sync() {
    if (currentId) {
      const s = S.sessions.find(x => x.id === currentId);
      if (s && s.endedAt) currentId = null;
      return;
    }
    const o = openSession();
    if (o && localDate(new Date(o.startedAt)) === localDate()) currentId = o.id;
  }
  Bus.on('sessions', () => { sync(); Bus.emit('session'); });
  Bus.on('turns', () => Bus.emit('session'));

  async function ensure() {
    sync();
    if (currentId) return currentId;
    if (creating) return creating;
    creating = (async () => {
      const stale = openSession();
      if (stale) {
        const last = Data.sessionTurns(stale.id).slice(-1)[0];
        await Platform.store.update('sessions/' + stale.id, { endedAt: (last && last.createdAt) || stale.startedAt }).catch(() => {});
      }
      const today = localDate();
      const n = S.sessions.filter(s => String(s.id).startsWith(today + '-')).length + 1;
      let id = today + '-' + n;
      if (S.sessions.some(s => s.id === id)) id = today + '-' + n + '-' + Math.random().toString(36).slice(2, 5);
      await Platform.store.set('sessions/' + id, { startedAt: nowIso(), endedAt: null, summary: null });
      currentId = id;
      Bus.emit('session');
      return id;
    })();
    try { return await creating; } finally { creating = null; }
  }

  function formatTop(top) {
    return top.map(t => `${t.type} (${ERROR_MAP[t.type] ? ERROR_MAP[t.type].name : ''}) ×${t.count}: "${t.example_orig}" → "${t.example_fix}"`).join('\n');
  }

  /* 结束：次数页面自己算，口诀和下次重点让 Claude 写（quick 档） */
  async function end() {
    const id = currentId;
    if (!id) return null;
    const turns = Data.sessionTurns(id);
    const errors = turns.flatMap(t => arr(t.errors));
    const top = Data.tallyErrors(errors).slice(0, 3).map(({ type, count, example_orig, example_fix }) => ({ type, count, example_orig, example_fix }));
    const summary = { top, rule_zh: null, next_focus_zh: [], nTurns: turns.length, nWords: turns.reduce((a, t) => a + (t.n_words || 0), 0) };
    let llmError = null;
    if (top.length && Platform.llm.available) {
      try {
        const r = await Platform.llm.json(fill(PROMPTS.summary, { top3: formatTop(top) }), { tier: 'quick', cache: false });
        summary.rule_zh = str(r && r.rule_zh) || null;
        summary.next_focus_zh = arr(r && r.next_focus_zh).map(str).filter(Boolean).slice(0, 2);
      } catch (e) { llmError = e; }
    }
    await Platform.store.update('sessions/' + id, { endedAt: nowIso(), summary });
    currentId = null;
    Bus.emit('session');
    return { id, summary, llmError };
  }

  return {
    get currentId() { sync(); return currentId; },
    ensure, end, formatTop,
  };
})();

/* ---- practice.js ---- */
/* =====================================================================
 * 练习：节点列表、节点页（听懂 / 逐句反馈 / 实战对话）、盖章生成口袋本
 * ===================================================================== */

/* ---------- 反馈结构校验：不信任未验证的 JSON ---------- */
function cleanErrors(list) {
  return arr(list).map(e => {
    if (!e || typeof e !== 'object') return null;
    let type = str(e.type).toUpperCase().replace('_', '-');
    if (!ERROR_MAP[type]) type = 'STRUCT';
    const orig = str(e.orig), fix = str(e.fix);
    if (!orig && !fix) return null;
    const sev = e.sev === 'high' || e.sev === 'low' ? e.sev : (ERROR_MAP[type].sev || 'low');
    return { type, orig, fix, sev, asr_suspect: e.asr_suspect === true && ASR_SUSPECT_TYPES.includes(type), note_zh: str(e.note_zh) };
  }).filter(Boolean);
}
const normText = s => str(s).toLowerCase().replace(/[^a-z0-9']+/g, ' ').trim();
function cleanFeedback(x) {
  if (!x || typeof x !== 'object' || Array.isArray(x)) throw { code: 'bad_shape', text: JSON.stringify(x) };
  const corrected = str(x.corrected);
  if (!corrected) throw { code: 'bad_shape', text: JSON.stringify(x) };
  let natural = x.natural == null ? null : (str(x.natural) || null);
  if (natural && normText(natural) === normText(corrected)) natural = null;
  return {
    corrected, natural,
    errors: cleanErrors(x.errors),
    asked_back: x.asked_back === true,
    vocab: arr(x.vocab).map(v => (v && typeof v === 'object' ? { zh: str(v.zh), en: str(v.en), example: str(v.example) } : null)).filter(v => v && v.zh && v.en).slice(0, 8),
    followup: str(x.followup),
  };
}
const sortErrors = errs => arr(errs).slice().sort((a, b) => (a.sev === 'high' ? 0 : 1) - (b.sev === 'high' ? 0 : 1));

/* ---------- 反馈卡片的零件（录音分析页也用） ---------- */
function errChip(e) {
  const t = ERROR_MAP[e.type];
  const note = h('span', { class: 'note', hidden: true }, e.note_zh || '（没有说明）');
  return h('button', {
    class: 'err sev-' + (e.sev === 'high' ? 'high' : 'low'), type: 'button', 'aria-expanded': 'false',
    onclick: ev => { note.hidden = !note.hidden; ev.currentTarget.setAttribute('aria-expanded', String(!note.hidden)); },
  },
    h('span', { class: 'err-top' },
      h('span', { class: 'code' }, e.type),
      h('span', { class: 'name' }, t ? t.name : ''),
      e.sev === 'high' ? h('span', { class: 'chip high' }, '高') : null,
      e.asr_suspect ? h('span', { class: 'asr' }, '可能是识别问题') : null),
    h('span', { class: 'fix' }, e.orig ? h('s', null, e.orig) : null, e.orig ? ' → ' : '', e.fix),
    note);
}
function errorsBlock(errors) {
  const list = sortErrors(errors);
  const lbl = h('span', { class: 'lbl' }, '错误');
  if (!list.length) return h('div', { class: 'fb-row' }, lbl, h('div', null, h('span', { class: 'chip ok' }, '没有发现错误')), h('span'));
  const shown = list.slice(0, MAX_SHOWN_ERRORS), rest = list.slice(MAX_SHOWN_ERRORS);
  const box = h('div', { class: 'errs' }, shown.map(errChip));
  if (rest.length) {
    const more = h('div', { class: 'errs', hidden: true }, rest.map(errChip));
    const label = '还有 ' + rest.length + ' 个';
    put(box, more, h('button', { class: 'link-btn', type: 'button', onclick: ev => { more.hidden = !more.hidden; ev.currentTarget.textContent = more.hidden ? label : '收起'; } }, label));
  }
  return h('div', { class: 'fb-row' }, lbl, box, h('span'));
}
function fbRow(label, text, cls) {

/* ---------- "说一次就够"：页面内语音识别，可选同时录音（M0 第 7、8 项通过才启用） ---------- */
const Voice = (() => {
  const SRc = () => window.SpeechRecognition || window.webkitSpeechRecognition || null;
  function mode() { return ls.get('voiceMode', 'auto'); }
  function enabled() {
    if (!SRc() || mode() === 'off' || ls.get('voiceBlocked', false)) return false;
    return mode() === 'on' || Probe.flags().asr === 'pass';
  }
  function withRecording() { return Probe.flags().asrWithRec === 'pass' && typeof MediaRecorder !== 'undefined'; }

  async function start(ta, onEnd) {
    const rec = new (SRc())();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    const base = ta.value.trim() ? ta.value.trim() + ' ' : '';
    const st = { error: null, blob: null, mime: '', durationSec: null };
    let stream = null, mr = null, chunks = [], t0 = 0, recStopped = null;
    if (withRecording()) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = AudioTools.pickRecorderMime();
        mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : { audioBitsPerSecond: 64000 });
        mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        recStopped = new Promise(res => { mr.onstop = res; });
        mr.start(1000); t0 = performance.now();
      } catch (_) { mr = null; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
    }
    rec.onresult = e => {
      let fin = '', interim = '';
      for (const r of Array.from(e.results)) { if (r.isFinal) fin += r[0].transcript; else interim += r[0].transcript; }
      ta.value = (base + fin + interim).replace(/\s+/g, ' ').trimStart();
    };
    rec.onerror = e => {
      st.error = e.error || 'error';
      if (st.error === 'not-allowed' || st.error === 'service-not-allowed') ls.set('voiceBlocked', true);
    };
    rec.onend = async () => {
      if (mr && mr.state !== 'inactive') { mr.stop(); await recStopped; }
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (mr && chunks.length) {
        st.blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        st.mime = st.blob.type; st.durationSec = Math.round((performance.now() - t0) / 100) / 10;
      }
      ta.dispatchEvent(new Event('input'));
      onEnd(st);
    };
    try { rec.start(); } catch (e) { st.error = e.name || 'start_failed'; rec.onend(); }
    return { stop() { try { rec.stop(); } catch (_) {} } };
  }
  return { enabled, withRecording, start, mode };
})();

const Practice = (() => {
  let root = null, cur = null, autoOpened = false;

  function init(el) {
    root = el;
    Bus.on('nodes', () => {
      if (!autoOpened && S.nodes.length) { autoOpened = true; autoOpen(); return; }
      if (cur) { const n = S.nodeMap[cur.id]; if (n) { cur.node = n; refreshHead(); } }
      else renderList();
    });
    Bus.on('turns', () => { if (cur) refreshHead(); else renderList(); });
    Platform.llm.onBlocked(() => { if (cur) openNode(cur.id, true); });
    Bus.on('personas', () => { if (cur && !cur.convo && !cur.busy) renderConvo(); });

  function autoOpen() {

  function show() {

  }

  /* ---------------- 节点列表 ---------------- */
  function renderList() {
    if (!root || cur || !S.loaded.nodes) return;

    if (!S.nodes.length) { put(clear(root), h('div', { class: 'notice' }, '大纲还没有写入数据库。请让 Claude 按 spec 附录 A 用 ArtifactData 写入种子数据。')); return; }
    const p1 = S.nodes.filter(n => n.priority === 1);
    const lastId = ls.get('lastNode');

      const ns = S.nodes.filter(n => n.track === tr.id);

        h('div', { class: 'track-head' }, h('h3', null, tr.name + ' · ' + tr.sub), h('span', { class: 'small muted' }, ns.filter(n => n.status === 'done').length + '/' + ns.length + ' 已盖章')),
        h('ul', { class: 'node-list' }, ns.map(n => h('li', null,
          h('button', { class: 'node-row' + (n.id === lastId ? ' is-current' : ''), type: 'button', onclick: () => openNode(n.id) },
            h('span', { class: 'nid' }, n.id),
            h('span', { class: 'nt' }, n.title_zh),
            h('span', { class: 'nq' }, n.main_q || (arr(n.listen).length + ' 条听力')),
            h('span', { class: 'nr' }, stampEl(n.status), h('span', { class: 'small muted' }, 'P' + n.priority + ' · ' + (counts[n.id] || 0) + ' 条')))))));
    });
    put(clear(root), 
      h('div', { class: 'row-between' }, h('h2', { class: 'section-title' }, '场景大纲'), h('span', { class: 'small muted' }, '出发前必练 ' + p1.filter(n => n.status === 'done').length + '/' + p1.length + ' 已盖章')),
      profileNudge(), ...blocks);
  }

  function profileNudge() {
    if (S.profile || !S.loaded.profile) return null;
    return h('div', { class: 'notice info' }, '先在设置里确认"我的素材"（住哪、做什么、为什么来），追问和口袋本会更贴近你。 ',
      h('button', { class: 'link-btn', type: 'button', onclick: () => App.go('settings') }, '去确认'));
  }

  /* ---------------- 节点页 ---------------- */
  function initialQ(node) {
    const sid = Sessions.currentId;
    const last = sid ? Data.sessionTurns(sid).filter(t => t.nodeId === node.id && t.mode === 'drill').slice(-1)[0] : null;

  function openNode(id, keepScroll) {
    const node = S.nodeMap[id];

      id, node, mode: ls.get('mode:' + id, 'drill'), q: initialQ(node), qIdx: 0,

    if (!listening) {
      els.seg = h('div', { class: 'seg', role: 'group', 'aria-label': '练习方式' },

        h('button', { type: 'button', 'aria-pressed': String(cur.mode === 'convo'), onclick: () => setMode('convo') }, '实战对话'));

      els.convo = h('div', { class: 'stack' });
      els.drill.hidden = cur.mode !== 'drill';
      els.convo.hidden = cur.mode !== 'convo';
      parts.push(els.seg, els.drill, els.convo);
